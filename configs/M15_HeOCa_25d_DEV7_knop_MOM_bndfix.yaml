# Post-F1 boundary-classification fix validation run (24-Sep-2026):
# identical setup to M15_HeOCa_25d_DEV7_knop_MOM.yaml, fresh model dir.
#
# Binary: cmfgen_nonmono_dev_V7 exe/cmfgen_dev.exe built 24-Sep-2026
# from commits 36b03eb (F1: outer-BC upwind keys on A_bnd =
# GAM*(HBC+NBC*sigma_true), not interior Q_NM), d8507dc (F3:
# GET_MOMS_NON_REL Eddington arrays re-size on ND change), 257ef3b
# (F4: KN_M_OUTBC per-frequency).  NOTE: build tree was dirty -- the
# binary also contains uncommitted WIP (comment/format cleanups plus a
# FORCE_LAMBDA FIX_IMPURITY/MOD_FIXED_T ordering fix in
# solve_for_pops.f), so it does not map to a single commit.
#
# Validation target: the baseline run's MOM_J_NONMONO_ERRORS carried
# thousands of depth-1 records (XM(1) ~ -920, fixer-fired) produced by
# the misclassified boundary row.  A correct fix should leave zero (or
# only intrinsic) depth-1 negative-J records, and HFLUX_AT_OB should
# no longer ride the fixer floor.
#
# Model itself is monotonic (sigma ~ 0): only the boundary-row branch
# is exercised, which is exactly what F1 fixes.  The compressing-zone
# J_NEXT branch is not tested here.
#
# History: before 19-Sep-2026 this config was a guard test that
# verified the hard STOP 'DO_NONMONO_KNOP=T requires USE_LAM_ES=T'
# (job 11818525, exit 6).  The stop was replaced by an informational
# message when the solver was ported.

model_name: M15_HeOCa_25d_DEV7_knop_MOM_bndfix
description: 'Post-F1/F3/F4 fix validation: M15-He-O-Ca-evo snapshot at
  25.10 d with DO_NONMONO_KNOP=T and USE_LAM_ES=F on the rebuilt dev7
  binary (boundary upwind keys on A_bnd); fresh dir for A/B vs the
  pre-fix dev7_knop_MOM run.'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: true
cancel_jobs: true
force_cancel: true
plot_lightcurve: false
submission: debug
hydro_backend: stella

cmfgen_conversion:
  snapshot_days:
  - 25.1
  use_existing_sn_hydro: true

cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 1000
  single_final: true
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: false
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  depth_independent_solver: true
  do_gt_auto: false
  non_mono_mode: KNOP
  vadat_overrides:
    DO_NONMONO_KNOP: T
    USE_LAM_ES: F
    LSTAR: 0.0D0
    VTURB: 50.0D0
    DIF: F
    IB_METH: ZERO_FLUX
    STOP_IF_BP: F
    REV_RGRID: F
    N_OB_INS: 0
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
  mem: 31G
  init_mem: 31G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de

output:
  model_dir: ./dev7_knop_MOM_bndfix/M15_HeOCa_25d_DEV7_knop_MOM_bndfix
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
