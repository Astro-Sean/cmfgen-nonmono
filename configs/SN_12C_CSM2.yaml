# SN_12C_CSM2 - 60-day STELLA run WITH extended CSM wind (to 1e17 cm)
# W&H07 s12.0 stripped He core, Type IIb, matching Ergon et al. 2022 model 12C / SN 2011dh
# CSM wind: sigmoid-blended low-density 1/r^2 wind, extended to r_outer ~ 1e17 cm
# CMFGEN snapshot at 30d post-SBO for spectral modelling

model_name: "SN_12C_CSM2"
description: "60-day run with extended CSM wind (r_outer ~ 1e17 cm). W&H07 s12.0 stripped He core, Type IIb matching Ergon et al. 2022 model 12C / SN 2011dh. 1.6 Msun He core ejecta + 0.1 Msun H layer + extended low-density CSM wind. CMFGEN at 30d post-SBO."

run_cmfgen: True
run_sirocco: False
run_sedona: False
run_superlite: False

reuse_stella: False
restart_stella: False

# ── KEPLER Pre-SN Model Configuration ──────────────────────────────────────
# The s12.0-presn-stripped file is the W&H07 12 Msun solar metallicity pre-SN
# model with the H envelope removed (stripped to He core at ~3.0 Msun).
# This mimics binary stripping that produces a Type IIb progenitor.
kepler_presn:
  presn_file: "/viper/ptmp1/sbrennan/SN2024pba/SN_12C_CSM2/s12.0-presn-stripped"
  mass_cut_msun: 1.4            # Compact remnant mass (Msun) - standard NS
  h_surface_fraction: 0.7      # H mass fraction in the thin surface layer (X=0.7)
  h_surface_mass_msun: 0.03     # Mass of the H surface layer in Msun — reduced from
                                # 0.10 to confine H to the outermost zones (v > 10,000
                                # km/s). With 0.10 Msun the H layer extended to v=6315
                                # km/s, placing the 30d photosphere (v=7362 km/s)
                                # inside the H layer and hiding He I lines. A Type IIb
                                # H layer should be ~0.01-0.05 Msun at the very surface.
  t_floor_K: 3000.0             # Initial temperature floor in K
  smooth_profile: True          # Smooth steep density gradients to prevent solver stall
  smooth_max_gradient: 5.0      # Threshold |dlog rho/dlog r| above which smoothing is applied
  smooth_sigma: 3.0             # Gaussian smoothing width in zone units

  # CSM wind: sigmoid-blended transition from the pre-SN stellar profile to a
  # low-density 1/r^2 wind. This provides optically thick material at large
  # radii, preventing STELLA's radiation solver from stalling when the
  # photosphere exits the compact ejecta.
  #
  # Parameters appropriate for a SESN (Type IIb) progenitor like SN 2011dh:
  #   - YSG progenitor wind: Mdot ~ 1e-5 Msun/yr, v_wind ~ 100 km/s
  #   - Extended wind: 320 yr duration → r_outer ~ 1e17 cm
  #   - Total CSM mass ~ 3e-3 Msun (negligible vs 1.7 Msun ejecta)
  #   - Sigmoid density profile: smooth C^inf transition from ejecta power-law
  #     to wind 1/r^2, avoiding density discontinuity at the interface
  csm_wind:
    n_zones: 50                 # Wind zones (reduces ejecta zones from 500 to 450)
    mdot_msun_yr: 1.0e-6        # Mass-loss rate — 10x lower than previous run to
                                # eliminate the early CSM interaction bump. With
                                # mdot=1e-5 the shock reached the CSM photosphere
                                # at ~3d (Mbol=-21, 6 mag too bright vs 2011dh).
                                # With mdot=1e-6 the breakout is at r~1.7e12 cm
                                # (10x closer), so the flash ends by <0.5d and by
                                # 3d the model is on the normal radioactively-
                                # powered lightcurve. Grey tau ~20 (stable).
    velocity_kms: 100           # Wind velocity (YSG wind, outer radius = v * t)
    duration_yr: 320            # Wind duration — extended wind (r_outer ~ 1e17 cm)
    T_K: 5000                   # Wind temperature
    density_profile: sigmoid    # Sigmoid-blended transition (C^inf smooth)
    # NOTE: power_law_index NOT set — using it (e.g. =15) creates density
    # gradients up to -16.6 at the ejecta-CSM interface which stalls the
    # GEAR solver at the initial condition. The default sigmoid transition
    # keeps gradients < 10 (smooth enough for stability).

# Ejecta parameters (unused for KEPLER pre-SN mode, but required by schema)
ejecta:
  M_ejecta_A: 0.0
  R_star_cm: 0.0
  n_shell: 0.0
  V_ejecta_A_initial_kms: 0.0

hydro_backend: stella
stella:
  convection: False
  target_days: 100.0            # 100 days total (~98.8d post-SBO)
  nzon: 500
  kappa: 0.34
  snapshot_interval: 1.0
  iout: 10
  r_min: 0.0
  rho_min: 0.0                  # No density trimming — CSM wind provides low-density
                                # outer material that prevents shock from exploding
                                # into vacuum
  stella_root: "/ptmp/sbrennan/stella/OpenStella"
  partition: "general"
  memory: "16G"
  time: "23:59:00"

  # Grid parameters
  outer_fraction: 0.3
  transition_radius: 1e13

  # Explosion parameters
  # Ergon et al. 2022: KE = 0.7 foe, Ni56 = 0.075 Msun
  # The thermal bomb at explosion_time=100s only converts ~61% of EBurst to KE
  # (0.426 foe from EBurst=7.0). To reach the target 0.7 foe KE:
  #   - Reduced explosion_time from 100s to 10s (more explosive, less radiative
  #     losses, higher KE conversion efficiency ~80-85%)
  #   - Increased explosion_energy from 7.0 to 9.0 (0.9 foe input)
  #   - Expected KE: ~0.7-0.75 foe (matching Ergon et al. 2022)
  explosion_energy: 9.0         # EBurst=9: 0.9e51 erg input (target 0.7 foe KE after losses)
  explosion_mass: 0.3           # AMHT: heated core mass in Msun
  explosion_time: 10.0          # tBurst=10s: shorter bomb for higher KE efficiency
  explosion_delay: 0.0

  # EKO=0: STELLA preserves .hyd velocities (all zero for pre-SN KEPLER model).
  initial_kinetic_energy: 0.0

  nstmax: 2000000
  eps: 0.003                    # Gear integrator accuracy (STELLA reference)
  hmax: 500000.0                # Max timestep (~5.8 days)
  hmin: 1.0e-14                 # Min timestep (STELLA reference)
  meth: 2                       # Standard GEAR
  aq: 50.0                      # Artificial viscosity (needed for thermal-bomb shock)
  bq: 1.0                       # Pseudo-viscosity (Rayleigh-Taylor)
  fit_tau: 5.0                  # FitTau=5 for SN ejecta with frequency-dependent
                                # opacity (X_scat2.dat reference). FitTau=15 collapses
                                # Ncnd prematurely (min-freq tau ~100x smaller than grey).
  tau_tol: 1.3                  # Ncnd tolerance band
  disable_scattering: False     # Enable scattering (needed for H-rich layers)
  stella_tau_min: 1e-4          # Trim outer zones with tau < this

  # Temperature convergence
  wacc_r: 1.0
  wacc_v: 1.0
  wacc_t: 0.5
  wacc_rad: 0.5
  temp_floor: 0.03              # FLOOR(T) in 10^4 K units (0.03 = 300 K)
  floor_rad: 0.01               # FLOOR(RADIAT) in 10^4 K units (0.01 = 100 K)

  # Opacity tables
  use_ronfict: true

  # Ni56 distribution (radioactive decay)
  # Ergon et al. 2022: 0.075 Msun Ni56
  nickel56:
    enabled: True
    total_mass_msun: 0.075     # Total Ni56 mass (Msun) - Ergon et al. 2022
    distribution_mass_msun: 0.3 # Distribute over inner 0.3 Msun of ejecta
    distribution_type: "uniform"
    inner_zone_fraction: 0.4    # Inner 40% of zones

# Temperature profile (unused for KEPLER mode - temperatures from KEPLER model)
temperature:
  temp_profile_type: "adiabatic"
  N_T_ejecta: 0.6
  T_inner_max: 100000
  T_csm: 5000

# CMFGEN conversion parameters
cmfgen_conversion:
  heracles_dir: "heracles"
  snapshot_days: [30]          # CMFGEN at 30 days post-SBO
  epoch_tolerance: 2.0
  stella_extra_days: 0
  output_file: "cmfgen/SN_HYDRO_DATA"
  cmfgen_tau_max: 30
  cmfgen_tau_min: 0.0
  n_grid: 100
  adaptive_grid: true
  gradient_threshold: 0.5
  velocity_max_kms: 20000
  opacity_model: "stella_nlte"
  kappa_constant: 0.34
  enable_grid_thinning: true
  grid_thinning_threshold: 0.005
  enable_adaptive_grid: true
  base_grid_target: 80
  max_points: 200
  min_points: 50
  min_nd: 150
  max_points: 200
  max_radius_jump: 0.05
  max_temp_jump: 0.10
  max_density_jump: 0.15
  smooth_velocity: true
  no_velocity_smoothing: false
  smooth_wiggles: true
  wiggle_window: 5
  velocity_smooth_window_kms: 50.0
  enable_velocity_spacing_optimization: false
  include_ne_amr: false
  max_ne_jump: 0.10
  max_logtau_jump: 0.25
  max_velocity_jump: 0.30
  max_sigma_jump: 0.5
  max_cell_ratio: 1.5
  thin_grid_tau: 1.0
  thin_grid_priority: 4.0
  outer_boundary_extra_points: 5
  outer_boundary_ratio: 1.5
  min_dr_r: 1.0e-6
  max_dr_r: 0.15
  sigma_priority_threshold: 0.5
  sigma_priority: 20.0
  dsigma_priority_threshold: 0.2
  dsigma_priority: 20.0
  smooth_sigma: false
  max_dsigma: 1.0
  sigma_smooth_passes: 10
  sigma_smooth_window: 0.3

# CMFGEN run parameters (matching X1_fix configuration)
cmfgen:
  base_dir: "./cmfgen_base"
  model_type: "static_snapshot"
  init_num_its: 25
  # single_final: removed (always True now; INIT/STABLE stages eliminated)
  proxy_populations: False            # CMFGEN built-in LTE_EST=T
  inc_rad_decays: True
  vturb: 20.0
  incl_rel: False
  vel_law: 12
  target_nd: 150
  depth_independent_solver: False  # TRIDIAG (NUM_BNDS=3, N_TYPE=N_ON_J): required for non-monotonic velocity (sigma < -1). G_ONLY cannot handle velocity reversals.
  remove_species: ["FeIV_ISF", "FeV_ISF"]  # Remove Fe IV/V: chi=54.8/77 eV, T_max=7709K at 30d → LTE pop ~1e-42, NLTE ~1e-26 (photoionization) → 1e16x trace-species noise
  vadat_overrides:
    OB_RAT: "1.0D0"
    N_OB_INS: "5"
    STOP_IF_BP: "F"
    # DIF and IB_METH are auto-detected by prepare_VADAT.py from SN_HYDRO_DATA:
    #   tau_inner >= 50 -> DIFFUSION (DIF=T)
    #   tau_inner <  50 -> ZERO_FLUX (DIF=F) — optically thin inner boundary
    FIX_T: "T"
    FIX_T_AUTO: "F"
    # CMFGEN manual (full_descr.tex) recommended values for BA/LAMBDA iterations:
    # MAX_LAM=1E5 (manual p.2783: "Typically adopt MAX_LAM=10^5") — LAMBDA iterations
    #   with LAM_SCALE_OPT=LIMIT cap trace species growth. Safe because LAMBDA
    #   doesn't use the BA matrix (no singularity risk).
    # MAX_LIN=3 (manual p.2781: "Typically adopt MAX_LIM=10"; reduced to 3 for
    #   cold-start stability — BA solve can produce extreme corrections when
    #   initial LTE populations are very wrong; 3x is safer than 10x for first BA).
    # BA_CHK_FAC=5% (manual p.2798: "Typically we adopt 5%") — hold BA fixed when
    #   corrections < 5%. Previous 1E-4 was 500x too tight, forcing BA recompute
    #   every iteration unnecessarily.
    # COMP_BA=T — always recompute BA matrix. Required for TRIDIAG with
    #   non-monotonic velocity (sigma < -1): stale BA at velocity reversal
    #   corrupts adjacent depths via inter-depth coupling.
    # DO_NG=F (AGENTS.md: Ng destabilizes trace species at ionization fronts).
    # METHOD=ZERO (manual p.1533: "Change METHOD to ZERO" for convergence difficulties).
    # LAM_SCALE_OPT=LIMIT (caps trace species growth in LAMBDA iterations).
    # REV_RGRID=F: runtime AMR regridding can overshoot for sigma < -1.
    DO_NG: "F"
    MAX_LAM: "1.0D5"
    MAX_LIN: "3.0D0"
    METHOD: "ZERO"
    LAM_SCALE_OPT: "LIMIT"
    BA_CHK_FAC: "5.0D-02"
    REV_RGRID: "F"
  partition: "general"
  time: "23:59:00"
  mem: "16G"
  init_mem: "16G"
  init_partition: "general"
  init_time: "23:59:00"
  n_ob_ins: 30
  final_requeue_when: "finish"  # Disable wall-time requeue (FINAL_SIGNAL_BEFORE_SEC=28800 > 2h wall time causes immediate requeue)
  final_requeue_max: 500
  auto_set_rstar: False
  auto_set_lstar: False
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: "RMAX"

# SEDONA configuration (Monte Carlo radiation transport)
sedona:
  partition: "general"
  cpus: 8                            # Number of CPUs for SEDONA (= ntasks)
  memory: "128G"
  time: "23:59:00"
  use_homologous_expansion: false    # Static snapshot mode
  use_nlte: false                    # LTE (Saha-Boltzmann populations)
  opacity_line_expansion: 1          # Sobolev ON with local |dv/dr|
  opacity_bound_bound: 0             # Direct Voigt OFF
  opacity_fuzz_expansion: 0          # Fuzz OFF
  line_velocity_width_kms: 200       # Turbulent broadening for Voigt lines
  nzon_target: 300                   # Target zones in .mod file
  transport_steady_iterate: 100      # 100 iterations for production
  ntasks: 8                          # MPI tasks
  core_n_emit: 1e6                   # Core photon emission
  particles_n_emit_thermal: 5e8      # 5e8 thermal photons (production)
  particles_n_emit_radioactive: 5e4  # Radioactive photon packets
  particles_max_total: 2e9           # Max total particles
  particles_last_iter_pump: 20       # Average over last 20 iterations
  transport_nu_grid_spacing: 0.005   # Transport grid: q=0.005
  transport_nu_min: 2.5e14           # Transport grid min (12000 A)
  transport_nu_max: 1.2e15           # Transport grid max (2500 A)
  spectrum_nu_grid_spacing: 0.0005   # Spectrum grid: q=0.0005 (~3 A/bin)
  transport_radiative_equilibrium: 1 # Solve for temperature
  transport_use_ddmc: 0              # DDMC off (standard MC)
  transport_ddmc_tau_threshold: 1000.0

# SuperLite configuration (Monte Carlo radiation transport)
superlite:
  partition: "general"
  ntasks: 1                          # SuperLite serial (OpenMP only, no MPI)
  cpus_per_task: 16                  # OpenMP threads
  memory: "16G"
  time: "23:59:00"
  install_dir: "/ptmp/sbrennan/superlite"
  exe: "/ptmp/sbrennan/superlite/superlite"
  truncate_tau: 20                   # Trim zones with tau_Ross > 20

# Output directories
output:
  model_dir: "./SN_12C_CSM2"
  stella_output: "stella"
  cmfgen_output: "cmfgen"
  sedona_output: "sedona"
  superlite_output: "superlite"
  plots: "plots"
  outputs: "output"
