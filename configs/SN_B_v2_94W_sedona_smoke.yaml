# SN_B v2: power-law CSM (rho ~ r^-n) analytical setup.
#   shell 8 Msun @ 4000 km/s, solar composition
#   CSM: rho ~ r^-n (csm_powerlaw_n), homologous u=r/t_cs, density-matched
#     to the SN_A ejecta inner edge - clean shell -> ejecta connection
#   old SN_A ejecta (SN_A_g_T20k_Ni06 at 1008 d) as the outer envelope,
#     UNSMOOTHED, clipped at v=10000 km/s
# Parent config: SB_M05_V08k_W1p5e-2_d350.yaml
model_name: SN_B_v2_94W
description: 'SN_B v2 (prepare_SN_B_model_v2.py): beta-law wind setup -
  8 Msun solar shell @ 4000 km/s, beta wind (v_inf=850 km/s, beta=1,
  Mdot=5e-2 Msun/yr) stitched to the unsmoothed SN_A_g_T20k_Ni06 ejecta
  clipped at 10000 km/s. STELLA 150 d, snapshot 80 d.'
run_cmfgen: false
run_sirocco: false
run_sedona: true
run_superlite: false
skip_stella: false
reuse_stella: true
cancel_jobs: false
force_cancel: false
plot_lightcurve: true
submission: debug
debug: false
debug_days: 40.0
restart_stella: false
x_model_from_sn:
  source_dir: /viper/ptmp1/sbrennan/SN2024pba/archive/old_sn_a_models/SN_A/SN_A_g_T20k_Ni06
  source_age_days: 1000.0
  # Inner shell: SN 1994W ejecta scale (paper's sn94w58: 7-8 Msun, ~4000 km/s)
  shell_mass_msun: 8.0
  shell_velocity_kms: 4000
  shell_composition: solar
  shell_xh: 0.7381
  shell_yhe: 0.2485
  n_rho: 8.0
  v0_kms: 3000.0
  n_T: 0.4
  T_interface_K: 5000.0
  T_max_K: 65000.0
  t_start_days: 8.0
  ejecta_T_floor_K: 2000.0
  # SN_A ejecta envelope: unsmoothed, clipped at 10000 km/s outer velocity
  ejecta_v_max_kms: 10000.0
  no_smooth_ejecta: true
  no_wind: false
  se_transition_dex: 0.5
  min_dlogr: 0.005
  max_dlogr: 0.15
  strict_grid: true
  # Power-law CSM (replaces the 1/r^2 steady wind):
  #   rho_wind = rho15 (r/1e15)^-n, u = r/t_cs.
  #   csm_powerlaw_n = 1,2,3 controls the steepness of the bridge.
  #   Density-matched to the ejecta inner edge (rho continuous there);
  #   the shell-side buffer is slope-matched so the join is smooth.
  #   csm_match_shell would anchor the law at the shell edge instead -
  #   one straight r^-n line but ~100+ Msun of CSM for this geometry.
  #   csm_age_days=0 -> t_cs = source_age + t_start (velocity-continuous
  #   with the ejecta); set explicitly for a slower (younger-age) CSM.
  powerlaw_csm: true
  csm_powerlaw_n: 2.0
  csm_density_match: false
  csm_age_days: 0.0
  # Beta-law steady wind (alternative to the power-law CSM):
  #   v(r) = v_inf (1 - R*/r)^beta, rho = Mdot / (4 pi r^2 v)
  #   wind_velocity_kms = v_inf (0 = ejecta inner-edge v, continuous)
  #   wind_mdot_msun_yr = Mdot (0 = density-matched to the ejecta)
  #   wind_rstar_cm = R* (0 = shell outer edge); wind_beta ~ 0.5-1
  beta_wind: true
  wind_beta: 1.0
  wind_rstar_cm: 0.0
  wind_clumping: 1.0  # clumping factor D: rho -> D*rho
  # Sharp shell->CSM velocity drop: resolved over this many buffer
  # zones (rest of buffer follows homologous u=r/t_cs). The density
  # ramp keeps the full sw_transition_dex width - compressing it to
  # ~0.1 dex pushes |dlog rho/dlog r| to ~50 and would stall STELLA.
  sw_transition_dex: 0.5
  sc_v_sharp_zones: 8
  # Acceleration zone before the ejecta: the last N CSM zones ramp the
  # velocity smoothly up to the SN_A inner-edge velocity. Needed when
  # v_inf < v_ejecta (e.g. v_inf=850 vs ~2200 km/s) so the interface
  # stays velocity-continuous instead of jumping.
  ce_v_ramp_zones: 40
  # Flat 5000 K initial temperature for CSM + ejecta (smooth ICs;
  # csm_T_gamma=0 makes the CSM isothermal, ejecta_T_const_K overrides
  # the SN_A source T profile)
  csm_T_K: 5000.0
  csm_T_gamma: 0.0
  csm_composition: solar
  ejecta_T_const_K: 5000.0
  # Wind keys: used by beta_wind mode above. Explicit Mdot is kept
  # as prescribed; the density mismatch at the interface is stitched
  # log-linearly into the ejecta over the trailing CSM zones.
  wind_mdot_msun_yr: 0.05
  wind_velocity_kms: 850.0
  wind_T_K: 2000
  explosion_energy: 0.0
  aq: 10.0
  fit_tau: 5.0
  meth: 3
  temp_floor: 0.03
  floor_rad: 0.01
  hmin: 1.0e-14
  hmax: 3600.0
ejecta:
