# SEDONA smoke test: compression-zone recipe on the 80 d snapshot.
# Direct Voigt (bound_bound=1) is the non-monotonic-safe opacity path;
# Sobolev/fuzz expansion are off (they assume homologous 1/t_exp gradients).
# DDMC=2 is required so line-center photons are not trapped in thick zones.
# nzon_target=0 keeps the native grid so the dv<0 dip is not smeared.
sedona:
  partition: interactive
  ntasks: 8
  cpus: 8
  memory: 16G
  time: '01:59:00'
  use_homologous_expansion: false
  use_nlte: false
  opacity_line_expansion: 0
  opacity_bound_bound: 1
  opacity_fuzz_expansion: 0
  line_velocity_width_kms: 200
  input_source: swd
  nzon_target: 0
  # tau_max trims inner zones with cumulative tau > tau_max.
  # Default 100 left the whole 500-zone model untrimmed (total tau=99.1),
  # so 1e5 photons random-walked out of a tau~100 interior: iteration 1
  # alone ran >3.5 h. tau_max=20 keeps 343 zones with the shock dip and
  # photosphere retained (boundary at r=3.19e15 cm, below the 3.4-4.2e15
  # shock); photons buried deeper cannot diffuse out in 80 d anyway.
  tau_max: 20.0
  transport_steady_iterate: 3
  core_n_emit: 0
  particles_n_emit_thermal: 1.0e5
  particles_n_emit_radioactive: 1.0e3
  particles_max_total: 2e8
  particles_last_iter_pump: 1
  transport_nu_grid_spacing: 0.001
  transport_nu_min: 1.0e14
  transport_nu_max: 2.0e16
  spectrum_nu_grid_spacing: 0.0005
  transport_radiative_equilibrium: 0
  transport_use_ddmc: 2
  # Threshold is per-CELL tau (discrete_diffusion.cpp:171), not cumulative.
  # Max cell tau is ~3, so 10.0 left DDMC inactive (tau_DDMC=24 vs
  # tau_MC=292). 1.0 engages DDMC in the ~30 deepest retained cells.
  transport_ddmc_tau_threshold: 1.0
