model_name: X_V6000M2_w2m54a390i_SOB_d63_lte_np
description: >
  SOB (Dessart, Audit & Hillier 2015 Sobolev line treatment)
  cold LTE start on the best-fitting SN_B X-grid model
  X_V6000M2_w2m54a390i, 30 days post r-band maximum (model day 63;
  r-band peaks at day 33.0 in the .tt lightcurve).  Reuses the
  existing 450-day STELLA .swd via cmfgen_conversion.stella_source_swd.
  Production cold run on development bd23277c, mirroring the m15
  SOB_l14_lte_np recipe: BA_EX_RELFRAC=0 (no trace exemption, the
  converged exit requires every species row below EPS_TERM=5e-2),
  BA_DEM_PFLOOR=1e-30, Stage-B polish BA_TR_MAXSWP=3.  DO_JFNK=F as
  in the proven X_V6000M2 recipes.
submission: normal
hydro_backend: stella
skip_stella: true
reuse_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
plot_lightcurve: false
cancel_jobs: false

output:
  model_dir: ./SN_B_X_grid/X_V6000M2_w2m54a390i_SOB_d63_lte_np
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output

cmfgen_conversion:
  snapshot_days:
  - 63.0
  epoch_tolerance: 2.0
  stella_source_swd: /viper/ptmp1/sbrennan/SN2024pba/SN_B_X_grid/X_V6000M2_w2m54a390i/stella/X_V6000M2_w2m54a390i.swd
  stella_extra_days: 0
  output_file: cmfgen/SN_HYDRO_DATA
  cmfgen_tau_max: 100
  cmfgen_tau_min: 0.0
  t_floor_K: 5000.0
  n_grid: 100
  adaptive_grid: true
  gradient_threshold: 0.5
  velocity_max_kms: 10000
  v_min_km_s: 100.0
  opacity_model: stella_nlte
  kappa_constant: 0.34
  enable_grid_thinning: false
  grid_thinning_threshold: 0.005
  enable_adaptive_grid: true
  use_tau_amr: false
  base_grid_method: stella_subset
  tau_spacing: auto
  composition_aware: true
  composition_grid_insertion: false
  composition_gradient_threshold: 0.3
  base_grid_target: 100
  max_points: 100
  max_thin_zones: 0
  max_thick_tau: 10000000000.0
  min_points: 100
  min_nd: 100
  coarsen_negative_sigma: false
  enable_sigma_conformance: false
  enable_velocity_conformance: false
  sigma_conformance_headroom: 0
  max_radius_jump: 0.05
  max_temp_jump: 0.1
  max_density_jump: 0.15
  smooth_velocity: false
  no_velocity_smoothing: true
  smooth_wiggles: false
  wiggle_window: 5
  velocity_smooth_window_kms: 50.0
  enable_velocity_spacing_optimization: false
  include_ne_amr: false
  max_ne_jump: 0.1
  ionization_front_aware: true
  ionization_front_threshold: 0.5
  ionization_front_min_points: 5
  ionization_front_width: 3
  ionization_front_cap: 0.15
  resolve_recombination_fronts: true
  recombination_t_jump: 0.3
  recombination_front_width: 5
  max_logtau_jump: 0.25
  max_velocity_jump: 0.3
  max_sigma_jump: 2.0
  max_cell_ratio: 2.0
  thin_grid_tau: 1.0
  thin_grid_priority: 1.0
  outer_boundary_extra_points: 0
  outer_boundary_ratio: 1.5
  min_dr_r: 0.0001
  max_dr_r: 0.15
  sigma_priority_threshold: 1.0
  sigma_priority: 2.0
  dsigma_priority_threshold: 0.3
  dsigma_priority: 2.0
  smooth_sigma: false
  smooth_sigma_scatter: false
  max_dsigma: 1.0
  sigma_smooth_passes: 10
  sigma_smooth_window: 0.3
  smooth_sigma_global: false
  sigma_global_window: 7
  sigma_global_max_rel_change: 0.05
  trace_threshold: 1.0e-06

cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 1000
  single_final: true
  target_nd: 100
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_jfnk
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: false
  proxy_populations: false
  proxy_populations_v2: false
  inc_rad_decays: false
  vturb: 20.0
  incl_rel: false
  vel_law: 11
  obs_line_treatment: blank
  obs_partition: general
  obs_mem: 60G
  mem: 30G
  init_mem: 30G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de
  vadat_overrides:
    # Cold LTE start (user directive): LTE populations, no warm
    # restart.  The KNOP lagged field builds from the early LAMBDA
    # sweeps before the freeze machinery engages.
    LTE_EST: T
    LIN_INT: T
    DC_METH: R
    OB_RAT: 1.0D0
    STOP_IF_BP: F
    # Optically thick inner edge at 63 d (tau_inner~53): the proven
    # X_V6000M2 recipes use the thick continuum + diffusion inner
    # boundary so LSTAR feeds the model (ZERO_FLUX would starve it).
    THK_CONT: T
    IB_STAB: 0.1D0
    DIF: T
    IB_METH: DIFFUSION
    USE_LAM_ES: T
    FIX_NE: F
    FIX_T: T
    FIX_T_AUTO: F
    FIX_IMP: T
    DO_LAM_AUTO: T
    DO_LAM_IT: T
    DO_JFNK: F
    DO_NG: F
    COMP_BA: T
    SOL_METH: DIAG
    N_IB_INS: '0'
    N_OB_INS: '0'
    BA_CHK_FAC: 1.0D-05
    REV_RGRID: F
    MIN_CF: 3.0D-3
    T_INIT_TAU: 1.5D0
    MAX_LAM: 1.0D10
    MAX_LIN: 5.0D0
    MAX_dT: 0.2D0
    LAM_VAL: 2.0D2
    NUM_LAM: '2'
    N_FIX_BA: '2'
    ALL_FREQ: F
    AUTO_SMOOTH: F
    DO_AV: F
    NEW_LINE_BA: T
    IND_BA_METH: '45'
    BEG_NG: 1.0D1
    IBEG_NG: '20'
    BW_NG: '40'
    NON_MONO_SOLVER: T
    ITS/NG: '8'
    T_ON_R: T
    SCL_SL_OPAC: T
    SCL_LN: F
    INC_GRID: F
    ST_INT: '40'
    END_INT: '55'
    IT_ON_T: T
    VFRAC_MOM: 5.0D0
    VFRAC_FG: 1.0D0
    LAM_SCALE_OPT: NONE
    CONV_DIAG_LVL: '1'
    # Strict full-system exit (m15 SOB_l14_lte_np recipe): no trace
    # exemption - every species row must satisfy EPS_TERM; floor-level
    # pops below BA_DEM_PFLOOR still excluded from the demand metric.
    EPS_TERM: 5.0D-02
    BA_DEM_PFLOOR: 1.0D-30
    BA_EX_RELFRAC: '0'
    BA_TR_MAXSWP: '3'
    BA_TR_ABSMAX: 1.0D-8
    DO_BA_RES_ACC: F
  cmf_flux_param_overrides:
    DO_CMF_EW: F
    WR_dFR: true
    WR_IP: true
