# SN_A Debug Config - Quick CMFGEN test with 100 iterations
# Uses same SN_A STELLA output and SN_HYDRO_DATA, but different model_name
# to avoid cancelling any running jobs.

model_name: "SN_A"
description: "Debug run of SN_A with 100 CMFGEN iterations"

run_cmfgen: True
run_sirocco: False
run_sedona: False

reuse_stella: True

# KEPLER pre-SN (same as SN_A - needed for profile generation)
kepler_presn:
  presn_file: "/ptmp/sbrennan/SN2024pba/SN_A/he8.00-presn"
  mass_cut_msun: 1.4
  h_surface_fraction: 0.2
  h_surface_mass_msun: 0.10
  t_floor_K: 3000.0

ejecta:
  M_ejecta_A: 0.0
  R_star_cm: 0.0
  n_shell: 0.0
  V_ejecta_A_initial_kms: 0.0

hydro_backend: stella

stella:
  convection: False
  target_days: 40.0
  nzon: 500
  kappa: 0.34
  snapshot_interval: 1.0
  iout: 1
  r_min: 0.0
  rho_min: 0.0
  stella_root: "/ptmp/sbrennan/stella/OpenStella"
  partition: "general"
  memory: "16G"
  time: "23:59:00"
  outer_fraction: 0.3
  transition_radius: 1e13
  explosion_energy: 10.0
  explosion_mass: 0.5
  explosion_time: 100.0
  explosion_delay: 0.0
  initial_kinetic_energy: 0.0
  nstmax: 2000000
  eps: 0.03
  hmax: 14400.0
  hmin: 1.0e-10
  meth: 3
  aq: 50.0
  bq: 1.0
  fit_tau: 1.0
  tau_tol: 1.3
  disable_scattering: False
  stella_tau_min: 1e-4
  wacc_r: 1.0
  wacc_v: 1.0
  wacc_t: 0.5
  wacc_rad: 0.5
  temp_floor: 0.3
  floor_rad: 0.1
  use_ronfict: true
  nickel56:
    enabled: True
    total_mass_msun: 0.06
    distribution_mass_msun: 0.5
    distribution_type: "uniform"
    inner_zone_fraction: 0.4

temperature:
  temp_profile_type: "adiabatic"
  N_T_ejecta: 0.6
  T_inner_max: 100000
  T_csm: 5000

cmfgen_conversion:
  heracles_dir: "heracles"
  snapshot_days: [30]
  epoch_tolerance: 5.0
  stella_extra_days: 0
  output_file: "cmfgen/SN_HYDRO_DATA"
  cmfgen_tau_max: 100
  cmfgen_tau_min: 0.01
  n_grid: 100
  adaptive_grid: true
  gradient_threshold: 0.5
  velocity_max_kms: 10000
  opacity_model: "stella_nlte"
  kappa_constant: 0.34
  enable_grid_thinning: false
  grid_thinning_threshold: 0.005
  enable_adaptive_grid: true
  base_grid_target: 120           # More base points for smoother outer boundary spacing
  base_grid_method: "log_tau"
  tau_breakpoints: [0.01, 1.0, 10.0]
  tau_zone_fractions: [0.10, 0.40, 0.35, 0.15]  # More weight to thin (outer) region
  max_thin_zones: 200
  max_thick_tau: 10.0
  max_points: 400
  min_points: 50
  min_nd: 150                     # More points for stable Lambda iteration
  max_radius_jump: 0.05
  max_temp_jump: 0.10
  max_density_jump: 0.15
  smooth_velocity: false
  no_velocity_smoothing: true
  smooth_wiggles: false
  enable_velocity_spacing_optimization: false
  include_ne_amr: false
  max_ne_jump: 0.10
  max_logtau_jump: 0.25
  max_velocity_jump: 0.30
  max_sigma_jump: 1.0             # Loosen from 0.3 — physical sigma reaches -23, can't be smoothed below true value
  max_cell_ratio: 1.5
  thin_grid_tau: 1.0
  thin_grid_priority: 1.0
  outer_boundary_extra_points: 3  # Geometric spacing at outer boundary to prevent 481:1 cell ratio
  outer_boundary_ratio: 1.5
  min_dr_r: 1.0e-6               # Minimum fractional cell size dr/r (prevents degenerate points)
  max_dr_r: 0.15                 # Maximum fractional cell size dr/r (prevents oversized cells)
  sigma_priority_threshold: 1.0
  sigma_priority: 20.0
  dsigma_priority_threshold: 0.3
  dsigma_priority: 20.0
  smooth_sigma: false
  max_dsigma: 1.0
  sigma_smooth_passes: 10
  sigma_smooth_window: 0.3

cmfgen:
  base_dir: "./cmfgen_base"
  model_type: "static_snapshot"
  init_num_its: 25            # 25 iterations with MAX_LAM=1.0D1 for slow Lambda convergence
  # single_final: removed (always True now; INIT/STABLE stages eliminated)
  proxy_populations: False             # Use CMFGEN built-in LTE_EST=T (not proxy _IN files)
  inc_rad_decays: False
  vturb: 20.0
  incl_rel: False
  vel_law: 12
  vadat_overrides:
    OB_RAT: "1.0D0"
    STOP_IF_BP: "F"
    STOP_IF_MW: "F"
  mem: "16G"
  init_mem: "16G"

output:
  model_dir: "./SN_A"           # Use SN_A's directory (has STELLA output + SN_HYDRO_DATA)
  stella_output: "stella"
  cmfgen_output: "cmfgen"
  sedona_output: "sedona"
  plots: "plots"
  outputs: "output"
