    USE_LAM_ES: T
    SOL_METH: DIAG
    DO_NOMONO_KNOP: T
    DO_NONMONO_KNOP: T
    DO_NOMONO_SOB: F
    DO_NONMONO_SOB: F
    NON_MONO_SOLVER: T
    N_OB_INS: '0'
    N_IB_INS: '0'
    REV_RGRID: F
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
