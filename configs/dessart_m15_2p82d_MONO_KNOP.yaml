model_name: dessart_m15_2p82d_MONO_KNOP
description: 'Monotonic-field A/B leg B: FG_J_CMF_NONMONO_V1 (Knop) solver on a velocity-monotonised SN_HYDRO_DATA (v reversed -> sigma > -1 everywhere, zero compressing cells).  Identical to MONO_V13 except
  the solver flag; the run must reproduce the V13 result to round-off in the expansion limit.  6 iterations, LTE_EST=T.

  '
submission: normal
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_MONO_KNOP
cmfgen_conversion:
  snapshot_days:
  - 2.82
  use_existing_sn_hydro: true
cmfgen:
  # A/B arm keeps the pre-default pinned-T policy so it stays
  # comparable with the l14_lte baseline (see AGENTS.md gotchas).
  fix_temperature: true
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  ncf_estimate: 56119
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
