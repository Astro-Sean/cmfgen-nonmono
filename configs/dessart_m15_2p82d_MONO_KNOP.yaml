model_name: dessart_m15_2p82d_MONO_KNOP
description: >
  Monotonic-field A/B leg B: FG_J_CMF_NONMONO_V1 (Knop) solver on a
  velocity-monotonised SN_HYDRO_DATA (v reversed -> sigma > -1
  everywhere, zero compressing cells).  Identical to MONO_V13 except
  the solver flag; the run must reproduce the V13 result to
  round-off in the expansion limit.  6 iterations, LTE_EST=T.
submission: normal
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_MONO_KNOP
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  ncf_estimate: 56119
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  non_mono_mode: KNOP
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 6
  cpus_per_task: 8
  mem: 32G
  warm_restart: false
  vadat_overrides:
    LTE_EST: T
    LSTAR: 4.265857D8
    RSTAR: 1.454688D4
    RMAX: 8.61436267
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
    MAX_CF: 2.0D2
    DIF: F
    IB_METH: ZERO_FLUX
    THK_LINE: T
    STOP_IF_BP: F
    FIX_T: T
    FIX_T_AUTO: T
    DO_T_AUTO: T
