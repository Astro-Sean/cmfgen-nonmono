model_name: dessart_m15_2p82d_SOB_jfnk_probe
description: Short JFNK probe run. Restarts from a snapshot of the
  live recovery checkpoint and forces one frozen-tier admission so the
  enhanced COLPROBE (F_i / rad / coll / ion / REPLACE / h-scan) can
  decompose the FD-vs-BA mismatch. Not a production run.
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_SOB_jfnk_probe
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  # ptmp1 worktree build: the only tree carrying the LSQ source; the
  # ptmp2 install is on the stalled NFS gateway.
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 14
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 10
  cpus_per_task: 8
  mem: 30G
  # 12-Oct-2026: the default SOB OBS (GLOBAL_LINE=SOB, TRANS_*=SOB)
  # renders each line across its Sobolev resonance surfaces, producing
  # broad undulations that cannot match the Dessart reference .fl.
  # 'blank' keeps the Knop formal J but resolves line profiles, as in
  # the matching KNOP OBS runs.  The blanketed observed grid needs
  # ~40GB, so the OBS job goes to the production partition.
  obs_line_treatment: blank
  obs_partition: general
  obs_mem: 60G
  final_requeue_when: wall
  final_requeue_max: 500
  # 10-Oct-2026: cold start at submission; warm_restart=true so the
  # resubmit (gate raise, see JFNK_FRZ_GATE below) keeps the
  # POINT1/POINT2 + SCRTEMP checkpoint instead of wiping ~230
  # iterations of Lambda marching.
  warm_restart: true
  # 12-Oct-2026: warm_restart_from disabled -- the probe's own
  # checkpoint (it.450 RVTJ) supersedes the snapshot, and staged
  # warm_restart_from files would overwrite the current RVTJ during
  # the OBS-only resubmit.
  # warm_restart_from: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_validation/m15_2p82d_SOB_jfnk_zlaw14_fresh/probe_snap
  vadat_overrides:
    LSTAR: 4.265857D8
    RSTAR: 1.454688D4
    RMAX: 8.61436267
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
    MAX_CF: 2.0D2
    DIF: F
    IB_METH: ZERO_FLUX
    THK_LINE: T
    STOP_IF_BP: F
    FIX_T: T
    FIX_T_AUTO: T
    # Native release when MAXCH_CTRL < 50%; this is separate from
    # FIX_T_AUTO, which does not release a global FIX_T hold.
    DO_T_AUTO: T
    FIX_IMP: F
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    USE_LAM_ES: T
    SOL_METH: DIAG
    DO_NOMONO_KNOP: F
    DO_NONMONO_KNOP: F
    N_OB_INS: '0'
    N_IB_INS: '0'
    REV_RGRID: F
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
    LAM_SET: F
    USE_J_REL: F
    USE_FRM_REL: F
    USE_DJDT_RTE: F
    INC_GRID: F
    N_TYPE: N_ON_J
    PURE_HUB: F
    VEL_LAW: '14'
    RD_IN_R_GRID: F
    FG_OPT: INT/INS
    USE_FIXED_J: F
    PP_MOD: F
    PP_NOV: F
    AUTO_SMOOTH: F
    NON_MONO_SOLVER: T
    DO_NOMONO_SOB: T
    DO_NONMONO_SOB: T
    DO_NONLOC_SOB: F
    GLOBAL_LINE: SOB
    DO_SOB_LINES: T
    SOB_FREQ_IN_OBS: T
    JBAR_W_EDD: F
    DO_NG: T
    COMP_BA: T
    NUM_LAM: '2'
    LAM_ENTER: 4.0D2
    LAM_EXIT: 5.0D0
    LAM_N_STABLE: '5'
    # 08-Oct-2026: all fork guard layers disabled at user request --
    # restores stock mode switching (MAXCH<50 hands off to full
    # iterations; no resacc rollback, probes, demand gates, demotions).
    BA_PROBE_LAM: '0'
    FRESH_BA_EXIT: T
    N_FULL_TREL: '0'
    DO_BA_RES_ACC: F
    BA_RES_GROW: 1.5D0
    BA_TRUST: 1.0D4
    BA_REJ_FRAC: 0.25D0
    BA_NREJ_LIM: '100'
    BA_ENTER_RAW: 1.0D30
    BA_DAMP_CAP: 0.0D0
    BA_SAT_RAW: 2.0D3
    BA_SAT_LIM: '0'
    # 11-Oct-2026: exempt floor-level populations from the demanded-
    # correction metric.  CV:1s_4p_1Po at depth 16 sits at ~1e-55
    # (inner-shell level, equilibrium ~1e-62) and is re-fed by cascade
    # couplings DIAG BA cannot see, so it re-demands a 1e7% decrease
    # every non-LAMBDA call.  That pins BA_LAST_RAW at the 1e7
    # sentinel and can never pass any finite JFNK_FRZ_GATE.  With the
    # floor armed the metric sees the real demand (~60).
    BA_DEM_PFLOOR: 1.0D-30
    # 08-Oct-2026: frozen-tier JFNK (Newton-Krylov on the lagged-J
    # SE residual) replacing the single clipped BA step on full
    # calls.  Coupled tier is unavailable under SOB.  Gates left at
    # 0 (ungated) so the tier fires on every eligible full call;
    # JFNK_PTC/LOGX/LS stay at their T defaults.
    DO_JFNK: T
    JFNK_WARMUP: '0'
    # 08-Oct-2026: admit JFNK only once the demanded MAXCH (%) stays
    # below the gate; gate=0 fired it inside the demand-200..700
    # Lambda recovery transient where frozen-J cannot help.
    # 09-Oct-2026: Jacobi test proved J~BA to 5.6% yet GMRES still
    # stalls -- the frozen-J residual is radiation-pinned and
    # Krylov-unreachable during the outer limit cycle.  Gate at 10%
    # so Newton acts as terminal polish, not a 10-min wasted admission
    # plus a 1e7-demand fallback step each cycle.
    # JFNK is a terminal correction after the outer BA/Lambda map has
    # reduced demand below 3% on two contracting eligible solves.  The
    # opt-in lagged-factor residual is an experiment to reduce the
    # measured gap with BA; verify it on a controlled run before use.
    JFNK_FRZ_GATE: 1.0D30
    JFNK_GATE_NREQ: '1'
    JFNK_LAG_FACTORS: T
    JFNK_COR_GATE: 5.0D0
    JFNK_MAX_EVALS: '200'
    JFNK_MAX_RESTART: '2'
    JFNK_DEEPDIAG: F
    # 08-Oct-2026: keep at 1e-30.  BA rows are population-scaled, so
    # 1e-10 flagged ~68% of every depth block (all trace-ion rows,
    # ~1260/1839 per depth) as null and projected away their Newton
    # updates.  Only structurally-null rows (NaN-zeroed compression
    # rows, exact-zero constraints) belong in JFNK_ROW_REG.
    JFNK_ROW_TINY: 1.0D-30
    # 08-Oct-2026: unconditional per-row LM ridge alpha*|A_ii| now
    # wired (was a dead knob).  Conservative 1e-8 to bound the
    # huge-z directions the unmasked near-singular rows produce.
    # 11-Oct-2026: LU admission showed ||z||_inf=1.3e25 -- the 1e-8
    # ridge leaves ~1e25 of near-null headroom, the FD JVP along z is
    # garbage (|FD|=3e17 vs |BA v|=0.3), GMRES flat -> abort.  1e-4
    # bounds the amplification at ~1e4 while leaving the stiff rows'
    # physical dn~1e-8 direction untouched.
    JFNK_RIDGE: 1.0D-4
    # Arm the REACH precheck as telemetry + a floor under truly
    # unreachable admissions (LU/LSQ only).  With the stored-BA
    # matvec it measures the fraction of |F|^2 the linear model can
    # remove in one step; gate=1e-3 skips only hopeless admissions.
    JFNK_REACH_GATE: 1.0D-3
    # 09-Oct-2026: m=10 GMRES produced anti-descent directions
    # (<F,Js><0) on the outer-depth H residual block -- the Krylov
    # space saturates before restart.  m=30 with a 90-iter cap per
    # Newton step gives the minimization room for a physical descent
    # direction while staying inside the 200-eval budget.
    JFNK_M: '30'
    JFNK_MAXGMRES: '90'
    # 09-Oct-2026: right-preconditioned GMRES.  Left-PC minimizes
    # ||M^-1(F-Js)|| which at row/col scales ~1e24-1e30 bears no
    # relation to the physical residual -- live solves converged the
    # preconditioned metric 58% while <F,Js><0 (ascent direction).
    # Right-PC minimizes ||F-Js|| directly, so any Krylov progress
    # yields a guaranteed descent direction.
    JFNK_LEFTPC: F
    # 11-Oct-2026: LSQ audit on the first right-PC admission showed
    # ||Mz-v||/||v||=1.0 -- the ridged normal equations (cond^2 at
    # row/col scales ~1e24-1e34) map F entirely into the numerical
    # null space, so GMRES builds an empty Krylov space.  JACOBI then
    # reached ~7% of |F| over two admissions (4.08->3.81e11, 5.69->
    # 5.31e11) and exhausted the Krylov space: the dominant residual
    # rows (HI 22/23, He2 12/13, depths 65-70) need within-depth
    # block couplings a diagonal M^-1 cannot supply.  LU is the
    # decisive test: under SOL_METH=DIAG the frozen J is exactly
    # block-diagonal per depth, so the equilibrated block LU is a
    # near-exact inverse -- reachable residual craters in ~1 GMRES
    # iteration; a stall means formulation-bound, not PC-bound.
    # REACH precheck is armed for LU, so unreachable admissions
    # self-skip after one apply+matvec.
    JFNK_PRECOND: LU
    JFNK_LSQ_LAM: 1.0D-2
    # Adaptive temperature release: T rows stay live in the JFNK
    # residual/JVP but the committed T step is damped (alpha ladder
    # 0.05 -> 1.0) until the energy residual falls below eps_thr of
    # its entry value.  Guards the STELLA T guess against the first
    # free-T Newton step.  Independent of FIX_T_AUTO, which stays F.
    JFNK_TAUTO: 'T'
    # 12-Oct-2026 review-branch opt-ins (cmfgen_jfnk/JFNK_REVIEW.md):
    # DIAG prices each residual row by its BA diagonal (Ne row by ED)
    # so the weighted norm approximates the largest demanded relative
    # correction; MXCH_TOL adds a convergence test on that metric;
    # POP_FL freezes levels below 1e-6 of their ion total out of the
    # Newton step (near-null rows that produced |z|~800); RIDGE_PIV
    # escalates the ridge when the measured pivot ratio is below 1e-10.
    JFNK_RSCALE: DIAG
    JFNK_MXCH_TOL: 5.0D-2
    JFNK_POP_FL: 1.0D-6
    JFNK_RIDGE_PIV: 1.0D-10
    LAM_VAL: 2.0D2
    BEG_NG: 1.0D1
    IBEG_NG: '15'
    BA_MAXCH_FAIL: 1.0D30
    REL_OBS: F
    REL_CMF: F
    DO_DDT: F
    INC_ADV: F
    INC_AD: F
    INCL_DJDT: F
    CHK_L_POS: T
    LIN_INT: F
    DO_DIS: T
    INC_PEN: T
    INC_CHG: F
    ALLOW_OL: F
    DC_METH: LTE
    T_INIT_TAU: 1.5D0
    SIG_GAU_KMS: 3.0D3
    INC_RAY: T
    MAX_LIN: 5.0D0
    # Asymmetric cap: decreases may step by up to a factor 1e4 per
    # non-LAMBDA solve (increases stay at MAX_LIN).  Breaks the
    # CV:1s_2p_1Po depth-10 limit cycle where a drain-pinned level
    # demanded ~1e5x every FULL solve but the symmetric cap only
    # allowed 5x, so the cell could never reach its asymptote.
    MAX_DEC: 1.0D4
    BA_CHK_FAC: 1.0D-05
    EPS_TERM: 5.0D-02
    BW_NG: '40'
    TRANS_HI: SOB
    TRANS_HeI: SOB
    TRANS_He2: SOB
    TRANS_CIII: SOB
    TRANS_CIV: SOB
    TRANS_CV: SOB
    TRANS_NIII: SOB
    TRANS_NIV: SOB
    TRANS_NV: SOB
    TRANS_O2: SOB
    TRANS_OIII: SOB
    TRANS_OIV: SOB
    TRANS_OV: SOB
    TRANS_OSIX: SOB
    TRANS_NeIII: SOB
    TRANS_NeIV: SOB
    TRANS_NeV: SOB
    TRANS_MgIII: SOB
    TRANS_MgIV: SOB
    TRANS_MgV: SOB
    TRANS_AlIII: SOB
    TRANS_AlIV: SOB
    TRANS_AlV: SOB
    TRANS_SkIII: SOB
    TRANS_SkIV: SOB
    TRANS_SkV: SOB
    TRANS_SIII: SOB
    TRANS_SIV: SOB
    TRANS_SV: SOB
    TRANS_ArIII: SOB
    TRANS_ArIV: SOB
    TRANS_ArV: SOB
    TRANS_CaIII: SOB
    TRANS_CaIV: SOB
    TRANS_CaV: SOB
    TRANS_CaSIX: SOB
    TRANS_TkIII: SOB
    TRANS_TkIV: SOB
    TRANS_TkV: SOB
    TRANS_CrIII: SOB
    TRANS_CrIV: SOB
    TRANS_CrV: SOB
    TRANS_CrSIX: SOB
    TRANS_FeIII: SOB
    TRANS_FeIV: SOB
    TRANS_FeV: SOB
    TRANS_FeSIX: SOB
    TRANS_FeSEV: SOB
  cmf_flux_param_overrides:
    DO_CMF_EW: F
    WR_dFR: true
    WR_IP: true
  notification_email: sbrennan@mpe.mpg.de
