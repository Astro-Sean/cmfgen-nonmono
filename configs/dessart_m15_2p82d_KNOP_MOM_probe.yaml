model_name: dessart_m15_2p82d_KNOP_MOM_probe
description: KNOP moment-solver analogue of the SOB mom probe.  Warm restarts
  from the same live-recovery snapshot (m15_2p82d_SOB_jfnk_zlaw14_fresh/
  probe_snap, an SOB-mode checkpoint -- the KNOP lagged I_NEXT and the MOM
  J_NEXT fields are rebuilt from scratch by N_LAM_RWARM forced-LAMBDA
  warm-up).  Purpose is the model-vs-wiring experiment for the m15 SOB
  moment runaway (job 12160690) - does MOM_J_CMF_NONMONO_V1's lagged
  J_NEXT map converge on this velocity field under the validated KNOP
  pairing (BLANK lines, FG_J_CMF_NONMONO_V1 ray moments, TRI BA), where
  the SOB pairing (SOB lines, FG_J_CMF_V13 ray moments, DIAG BA) showed
  the map drifting ~4x per sweep and luminosity running 3.9E8->3.4E13
  once the compressing branch matured.  If KNOP diverges identically
  the expansive map is a property of the model field, not of the SOB
  call site.  DO_JFNK=F - admission is gated on USE_LAM_ES anyway.
  Not a production run.
# debug -> interactive partition (1:59 per segment): same testing policy
# as the SOB probes.  Memory is the risk: the KNOP I_NEXT store put the
# LAM probe at ~32G, over the 30G interactive cap; DO_JFNK=F drops the
# JFNK eval machinery which may bring it under.  If submit refuses or
# the job OOMs, resubmit with submission: normal.
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
