# USE_LAM_ES=T + DO_NOMONO_KNOP (reverted 18-Sep-2026).  The Knop formal
# solution still runs (FG_J_CMF_NONMONO_V1 with signed I_NEXT/I_PREV
# coupling); J is taken directly from it (RJ=TC) rather than from the
# moment solve.  The experimental USE_LAM_ES=F moment-solver path
# (MOM_J_CMF_NONMONO_V1) diverged on this model -- compression-zone J
# reached ~1E18 and the outer luminosity grew ~9x/iteration for 8+
# consecutive iterations.  Matches the proven TRI / TRI_C_CLEAN path.

model_name: T6k_M7.0_V10000_TRI_LAM_ES
description: 'T6k grid point: H/He shell M=7.0 Msun, v=10000 km/s, solar comp;
  wind Mdot=1e-3 Msun/yr, v=100 km/s; 400d-old SN_A_g_T20k_Ni06 ejecta;
  Ni56=1e-4 Msun. CMFGEN V6 debug run at 40d with non-monotonic solver.'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: false
reuse_stella: true
cancel_jobs: true
force_cancel: true
plot_lightcurve: false
submission: normal
debug: true
debug_days: 40.0
restart_stella: false
x_model_from_sn:
  source_dir: /viper/ptmp1/sbrennan/SN2024pba/archive/old_sn_a_models/SN_A/SN_A_g_T20k_Ni06
  source_age_days: 400.0
  shell_mass_msun: 7.0
  shell_velocity_kms: 10000
  shell_composition: solar
  shell_xh: 0.7381
  shell_yhe: 0.2485
  n_rho: 8.0
  v0_kms: 3000.0
  n_T: 0.4
  T_interface_K: 2000.0
  T_max_K: 65000.0
  t_start_days: 5.0
  ejecta_T_floor_K: 2000.0
  ejecta_rho_min: 1.0e-20
  ejecta_v_max_kms: 10000.0
  no_wind: false
  se_transition_dex: 0.5
  min_dlogr: 0.005
  max_dlogr: 0.15
  strict_grid: true
  wind_mdot_msun_yr: 0.001
  wind_velocity_kms: 100
  wind_T_K: 2000
  explosion_energy: 0.0
  aq: 10.0
  fit_tau: 5.0
  meth: 3
  temp_floor: 0.03
  floor_rad: 0.01
  hmin: 1.0e-14
  hmax: 3600.0
ejecta:
  M_ejecta_A: 0.0
  R_star_cm: 0.0
  n_shell: 0.0
  V_ejecta_A_initial_kms: 0.0
hydro_backend: stella
stella:
  convection: false
  target_days: 100.0
  nzon: 500
  kappa: 0.34
  snapshot_interval: 1.0
  iout: 10
  r_min: 0.0
  rho_min: 0.0
  stella_root: /raven/ptmp/sbrennan/stella/OpenStella
  memory: 16G
  outer_fraction: 0.3
  transition_radius: 10000000000000.0
  explosion_energy: 0.0
  explosion_mass: 0.0
  explosion_time: 1.0
  explosion_delay: 0.0
  initial_kinetic_energy: 0.0
  nstmax: 2000000
  eps: 0.003
  hmax: 3600.0
  hmin: 1.0e-14
  meth: 3
  aq: 10.0
  bq: 1.0
  fit_tau: 5.0
  tau_tol: 1.3
  disable_scattering: false
  stella_tau_min: 0.0001
  wacc_r: 1.0
  wacc_v: 1.0
  wacc_t: 0.5
  wacc_rad: 0.5
  temp_floor: 0.03
  floor_rad: 0.01
  use_ronfict: true
  nickel56:
    enabled: true
    total_mass_msun: 0.0001
    distribution_mass_msun: 0.5
    distribution_type: uniform
    inner_zone_fraction: 0.15
temperature:
  temp_profile_type: adiabatic
  N_T_ejecta: 0.6
  T_inner_max: 100000
  T_csm: 5000
cmfgen_conversion:
  heracles_dir: heracles
  snapshot_days:
  - 40.0
  epoch_tolerance: 2.0
  stella_extra_days: 0
  output_file: cmfgen/SN_HYDRO_DATA
  cmfgen_tau_max: 100
  cmfgen_tau_min: 0.0
  t_floor_K: 5000.0
  n_grid: 100
  adaptive_grid: true
  gradient_threshold: 0.5
  velocity_max_kms: 10000
  v_min_km_s: 100.0
  opacity_model: stella_nlte
  kappa_constant: 0.34
  enable_grid_thinning: false
  grid_thinning_threshold: 0.005
  enable_adaptive_grid: true
  use_tau_amr: false
  base_grid_method: stella_subset
  tau_spacing: auto
  composition_aware: true
  composition_grid_insertion: false
  composition_gradient_threshold: 0.3
  base_grid_target: 100
  # Auto grid mode (18-Sep-2026): no smoothing, no coarsening -- pure
  # constraint-driven refinement.  The converter's physical checks
  # (velocity conformance: per-cell |dV| <= vfrac_mom*vdop_kms, matching
  # the VADAT validity criterion VFRAC_MOM*VTURB; sigma conformance:
  # dsigma/cell-ratio/dr_r on the final grid; outer-tau adaptive) insert
  # points wherever violated, bounded only by auto_max_points.
  # 40d snapshot genuinely needs ~490 pts at vfrac_mom=2 (strict) inside
  # the 5.5k km/s compression ramp + vfrac_mom_normal=4 elsewhere; 550
  # leaves headroom for the post-PCHIP-resample re-conform iterations.
  auto_max_points: 550
  max_points: 550
  max_thin_zones: 0
  max_thick_tau: 10000000000.0
  min_points: 100
  min_nd: 100
  coarsen_negative_sigma: false
  enable_sigma_conformance: true
  enable_velocity_conformance: true
  sigma_conformance_headroom: 40
  vdop_kms: 20.0
  # Two-regime dV conformance: strict 2 VDOP (40 km/s) only inside/adjacent
  # to compressing regions (sigma<-1: shock, reversals, Knop a_lambda
  # transitions); smooth expanding regions use 4 VDOP (80 km/s).  These
  # are engineering parameters, not prescribed by Knop.
  vfrac_mom: 2.0
  vfrac_mom_normal: 4.0
  # Hard-cap protected regions: the point cap may never remove the
  # innermost/outermost N cells (post-shock material / radiation-field
  # stability).  Velocity extrema, sigma<-1 cells, composition interfaces
  # and near-limit dV cells are protected automatically by the converter.
  protect_inner_points: 8
  protect_outer_points: 8
  # Velocity resample interpolant at final grid radii. 'pchip' is a
  # shape-preserving cubic: preserves monotonicity and all velocity
  # extrema exactly, but makes dV/dR continuous across STELLA zone
  # boundaries so sigma varies smoothly through the shock instead of
  # sawtoothing at every hydro-zone edge (sigma roughness ~-57% on the
  # 40d snapshot). Can deviate from the literal piecewise-linear STELLA
  # profile by ~100-160 km/s inside the 5-zone compression ramp; dV
  # conformance is re-verified after resampling.
  v_resample_interp: pchip
  max_radius_jump: 0.05
  max_temp_jump: 0.1
  max_density_jump: 0.15
  smooth_velocity: false
  no_velocity_smoothing: true
  smooth_wiggles: false
  wiggle_window: 5
  velocity_smooth_window_kms: 50.0
  enable_velocity_spacing_optimization: false
  include_ne_amr: false
  max_ne_jump: 0.1
  ionization_front_aware: true
  ionization_front_threshold: 0.5
  ionization_front_min_points: 5
  ionization_front_width: 3
  ionization_front_cap: 0.15
  resolve_recombination_fronts: true
  recombination_t_jump: 0.3
  recombination_front_width: 5
  max_logtau_jump: 0.25
  max_velocity_jump: 0.3
  max_sigma_jump: 2.0
  max_cell_ratio: 2.0
  thin_grid_tau: 1.0
  thin_grid_priority: 1.0
  outer_boundary_extra_points: 5
  outer_boundary_ratio: 1.5
  # Outer-boundary adaptive refinement: the previous grid produced the
  # recurring "J(mom) and J(ray) differ by more than 1000% for last
  # frequency" warning -- CMFGEN wants finer resolution at depth 1.
  outer_tau_adaptive: true
  outer_tau_max_points: 80
  # Outer-region limits aligned with the two-regime dV budget: the old
  # defaults (dv<=20 km/s = 1 VDOP, dr/r<=0.015) were stricter than the
  # strict shock-region criterion and drove ~250 outer insertions chasing
  # a 1-VDOP target in smooth expanding gas.  80 km/s matches
  # vfrac_mom_normal; dr/r<=0.05 is still conservative for CMFGEN.
  outer_tau_dv_kms: 80.0
  outer_tau_dr_r: 0.05
  # Multi-variable smoothness pass DISABLED: on this shocked profile it
  # inserts ~900 midpoints at any threshold (the Dessart 5%/10% rule
  # triggers nearly everywhere across the discontinuity) and consumes
  # the entire point budget before the physics-critical passes
  # (velocity conformance, sigma conformance, outer-tau adaptive) run.
  # Those passes subdivide shock cells anyway, so T/rho/ne jumps get
  # resolved where they matter.  It was designed for moment-solve
  # smoothness, which USE_LAM_ES=T bypasses.
  multivar_grid_criteria: false
  min_dr_r: 0.0001
  max_dr_r: 0.15
  sigma_priority_threshold: 1.0
  sigma_priority: 2.0
  dsigma_priority_threshold: 0.3
  dsigma_priority: 2.0
  smooth_sigma: false
  smooth_sigma_scatter: false
  max_dsigma: 1.0
  sigma_smooth_passes: 10
  sigma_smooth_window: 0.3
  smooth_sigma_global: false
  sigma_global_window: 7
  sigma_global_max_rel_change: 0.05
  sigma_global_preserve_threshold: 2.0
  trace_threshold: 1.0e-06
cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 1000
  single_final: true
  target_nd: auto
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V6
  non_mono_mode: KNOP
  proxy_populations: false
  proxy_populations_v2: false
  proxy_populations_nlte_solver: true
  proxy_populations_min_ion_frac: 1.0e-30
  proxy_populations_t_exc_min: 0.3
  proxy_t_ion_floor: 0.05
  proxy_ionization_mode: nebular
  proxy_t_exc_source: rad
  proxy_complex_model: true
  proxy_mass_frac_floor: 1.0e-08
  inc_rad_decays: false
  vturb: 20.0
  incl_rel: false
  vel_law: 12
  depth_independent_solver: false
  vadat_overrides:
    LTE_EST: T
    LIN_INT: T
    DC_METH: R
    OB_RAT: 1.0D0
    STOP_IF_BP: F
    THK_CONT: F
    IB_STAB: 0.1D0
    DIF: F
    IB_METH: ZERO_FLUX
    USE_LAM_ES: T
    FIX_NE: F
    FIX_T: T
    FIX_T_AUTO: F
    FIX_IMP: T
    DO_LAM_AUTO: T
    DO_LAM_IT: T
    USE_JFNK: F
    JFNK_WARMUP: '0'
    JFNK_NITS: '20'
    JFNK_M: '40'
    JFNK_MAXGMRES: '100'
    JFNK_GTOL: 1.0D-2
    JFNK_TOL: 1.0D-4
    JFNK_EPS: 1.0D-4
    JFNK_FIXT: T
    JFNK_VERB: T
    DO_NG: F   # user directive 15-Sep-2026: keep Ng off
    COMP_BA: T
    SOL_METH: TRI
    N_IB_INS: '0'
    N_OB_INS: '0'
    BA_CHK_FAC: 1.0D-05
    REV_RGRID: F
    MIN_CF: 3.0D-3
    T_INIT_TAU: 1.5D0
    MAX_LAM: 1.0D10
    MAX_LIN: 5.0D0
    MAX_JFNK: 1.0D1
    MAX_dT: 0.2D0
    JFNK_RIDGE: 0.0D0
    JFNK_RSCALE: EUCLIDEAN
    JFNK_MAX_RESTART: '8'
    JFNK_PRECOND: LU
    JFNK_REFINE: T
    JFNK_LEFTPC: F
    JFNK_PC_RF: 0.8
    JFNK_LAM_THRESH: 6.0D1
    JFNK_LS: T
    JFNK_LS_MAX: '20'
    JFNK_LS_BETA: 0.5D0
    JFNK_LS_C: 1.0D-4
    JFNK_CAUCHY: T
    LAM_VAL: 2.0D2
    NUM_LAM: '2'
    ALL_FREQ: F
    AUTO_SMOOTH: F
    DO_AV: F
    NEW_LINE_BA: T
    IND_BA_METH: '45'
    BEG_NG: 1.0D1
    IBEG_NG: '20'
    BW_NG: '40'
    DO_NOMONO_KNOP: T
    DO_NOMONO_SOB: F
    ITS/NG: '8'
    T_ON_R: T
    SCL_SL_OPAC: T
    SCL_LN: F
    INC_GRID: F
    ST_INT: '40'
    END_INT: '55'
    IT_ON_T: T
    VFRAC_MOM: 5.0D0
    VFRAC_FG: 1.0D0
    LAM_SCALE_OPT: NONE
    STORE_BA: F
    STORE_BA_INV: F
    WR_PRT_INV: F
    N_FIX_BA: '2'
  # Correction scaling disabled (2026-09-15): relax=1.0, max_chng=1e3 are
  # neutral values - full BA corrections, effectively no population cap.
  # File is still written so a stale damped ADJUST_CORRECTIONS cannot persist.
  adjust_corrections:
    l_st: 1
    l_end: 100
    relax: 1.0
    t_lim: 0.2
    max_chng: 1.0D3
    consis_cnt: 0
  # ND~880 grid OOM'd the 30G debug preset (~31GB MaxRSS during early STEQ
  # init and still rising).  Interactive nodes have ~480GB; request 4x
  # headroom.  (get_job_resources now honours an explicit mem key in
  # debug mode -- previously it silently forced DEBUG_MEM=30G.)
  # 17-Sep-2026: 60G OOM'd in FG_J_CMF_NONMONO_V1. The Gauss-Seidel store
  # I_P/I_M_DEPTH_NEXT needs 2*N_COMP*NP*NCF_IN*8 = 2*235*488*36736*8
  # = 67.4GB at ND=476 (235 compressing depths vs 14 at ND=104), and is
  # zeroed on allocation so it is resident immediately.
  mem: 160G
  init_mem: 160G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de
output:
  model_dir: ./SN_B_v2_T6k_grid/T6k_M7.0_V10000_TRI_LAM_ES
  stella_output: stella
