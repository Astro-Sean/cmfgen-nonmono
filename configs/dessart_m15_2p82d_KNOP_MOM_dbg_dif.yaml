model_name: dessart_m15_2p82d_KNOP_MOM_dbg_dif
description: "A/B vs dessart_m15_2p82d_KNOP_MOM_dbg: DIF=T + IB_METH=DIFFUSION
  + LSTAR=4.265857D8 (SN_HYDRO_DATA header Energy Lum, matching the converged
  m15_2p82d_knop_SOB VADAT and Luc's VADAT).  Baseline ran ZERO_FLUX+LSTAR=0
  with DTDR=0 every iteration -- an insulating inner boundary at the fastest,
  most compressed cell (R=1.45e14 cm, V=7073 km/s, tau_IB=39.3).  Tests
  whether a fixed physical inner-boundary flux anchor stabilises the KNOP
  MOM lagged map (deep-field anchoring).  Cold start, interactive."
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_knop_MOM_dif
cmfgen_conversion:
