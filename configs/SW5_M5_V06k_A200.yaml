# SW5 batch: systematic decline-rate scan (mass x velocity x contact age).
# intermediate velocity + moderate target
# Parent config: /viper/ptmp1/sbrennan/SN2024pba/configs/SW2_M5_V07k_W3m4.yaml
model_name: SW5_M5_V06k_A200
description: 'SW5 decline-scan: n_rho=8 shell (M=5.0 Msun, v=6000 km/s, cold 2000
