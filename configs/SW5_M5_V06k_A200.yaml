  shell_xh: 0.7381
  shell_yhe: 0.2485
  n_rho: 8.0
  v0_kms: 2100.0
  n_T: 0.4
  T_interface_K: 2000.0
  T_max_K: 2000.0
  t_start_days: 69.0
  ejecta_T_floor_K: 2000.0
  ejecta_rho_min: 1.0e-20
