# SN_A best-fit model CMFGEN spectrum at ~35 days post-SBO (21-Sep-2026).
#
# Model: SN_A_g_T20k_Ni05 — best-fitting SN_A lightcurve model under the
# MJD<60544 window (rms 0.244; AGENTS.md 1.5). STELLA output reused from
# archive/old_sn_a_models/SN_A/SN_A_g_T20k_Ni05/stella/SN_A_g_T20k_Ni05.swd
# (runs to ~62 d, so the 35 d snapshot is inside the range).
#
# Solver settings identical to the running TypeIIn_10d_DEV7_KNOP2 model
# (user request): dev7 Knop non-monotonic solver (DO_NONMONO_KNOP,
# FG_J_CMF_NONMONO_V1) + GLOBAL_LINE=BLANK, same VADAT overrides
# (ZERO_FLUX inner BC, FIX_T, FIX_NE, FIX_BA=1/N_FIX_BA=10), so the two
# spectra are directly comparable. The SN_A ejecta is monotonic
# (min sigma -0.78) — the Knop solver handles arbitrary V fields.
#
# skip_stella: reuses the archived .swd; only the SN_HYDRO_DATA
# conversion at snapshot_days=35.0 runs, then CMFGEN + OBS.
#
# The only TypeIIn keys not carried over are the conversion velocity
# window (300-20000 km/s here vs 2500-10000 for TypeIIn — that window
# would truncate the SN_A ejecta wing at 13716 km/s) and the swd path.

model_name: SN_A_g_T20k_Ni05
description: 'SN_A best fit (SN_A_g_T20k_Ni05, rms 0.244): CMFGEN spectrum
  at ~35 d post-SBO, standard solver, Ni56 decay on.'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: true
cancel_jobs: true
force_cancel: true
plot_lightcurve: false
submission: normal
hydro_backend: stella

cmfgen_conversion:
  heracles_dir: heracles
  stella_source_swd: /viper/ptmp1/sbrennan/SN2024pba/archive/old_sn_a_models/SN_A/SN_A_g_T20k_Ni05/stella/SN_A_g_T20k_Ni05.swd
  snapshot_days:
  - 35.0
  epoch_tolerance: 2.0
  stella_extra_days: 0
  output_file: cmfgen/SN_HYDRO_DATA
  cmfgen_tau_max: 30
  cmfgen_tau_min: 0.01
  n_grid: 100
  adaptive_grid: true
  gradient_threshold: 0.5
  # SN_A ejecta is faster than TypeIIn (E=9 foe); keep the outer wing and
  # include the deep Ni56-powered inner ejecta (low v_min).
  velocity_max_kms: 20000
  v_min_km_s: 300.0
  opacity_model: stella_nlte
  kappa_constant: 0.34
  enable_grid_thinning: false
  grid_thinning_threshold: 0.005
  enable_adaptive_grid: true
  use_tau_amr: true
  base_grid_method: log_tau
  tau_spacing: auto
  composition_aware: true
  composition_grid_insertion: false
  composition_gradient_threshold: 0.5
  base_grid_target: 100
  max_points: 150
  max_thin_zones: 0
  max_thick_tau: 10000000000.0
  min_points: 80
  min_nd: 80
  sigma_conformance_headroom: 30
  max_radius_jump: 0.05
  max_temp_jump: 0.1
  max_density_jump: 0.15
  smooth_velocity: false
  no_velocity_smoothing: true
  smooth_wiggles: false
  wiggle_window: 5
  velocity_smooth_window_kms: 50.0
  enable_velocity_spacing_optimization: false
  include_ne_amr: false
  max_ne_jump: 0.1
  ionization_front_aware: true
  ionization_front_threshold: 0.5
  ionization_front_min_points: 5
  ionization_front_width: 3
  ionization_front_cap: 0.15
  resolve_recombination_fronts: true
  recombination_t_jump: 0.3
  recombination_front_width: 5
  max_logtau_jump: 0.25
  max_velocity_jump: 0.3
  max_sigma_jump: 2.0
  max_cell_ratio: 2.0
  thin_grid_tau: 1.0
  thin_grid_priority: 1.0
  outer_boundary_extra_points: 5
  outer_boundary_ratio: 1.5
  min_dr_r: 0.0001
  max_dr_r: 0.15
  sigma_priority_threshold: 1.0
  sigma_priority: 2.0
  dsigma_priority_threshold: 0.3
  dsigma_priority: 2.0
  smooth_sigma: false
  smooth_sigma_scatter: false
  max_dsigma: 1.0
  sigma_smooth_passes: 10
  sigma_smooth_window: 0.3
  smooth_sigma_global: false
  sigma_global_window: 7
  sigma_global_max_rel_change: 0.05
  trace_threshold: 1.0e-06

cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 200
  single_final: true
  cpus_per_task: 4
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: true
  vturb: 20.0
  incl_rel: false
  # VEL_LAW=11 (SET_RV_HYDRO_MODEL_V3): reads R from RDINR and interpolates
  # V directly from SN_HYDRO_DATA.
  vel_law: 11
  depth_independent_solver: true
  # Dev7 Knop et al. (2009) non-monotonic formal solver
  # (FG_J_CMF_NONMONO_V1) + GLOBAL_LINE=BLANK — same solver as the
  # running TypeIIn_KNOP2 model for a directly comparable spectrum.
  non_mono_mode: KNOP
  do_gt_auto: false
  proxy_populations: true
  vadat_overrides:
    LSTAR: 0.0D0
    VTURB: 20.0D0
    DIF: F
    IB_METH: ZERO_FLUX
    STOP_IF_BP: F
    # T structure comes from the hydro (incl. Ni56 heating) — hold fixed.
    FIX_T: T
    FIX_T_AUTO: F
    FIX_IMP: T
    # Start in Lambda mode, auto-switch to BA at MAXCH<50%.
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    # Explicit KNOP activation (both spellings).
    DO_NOMONO_KNOP: T
    DO_NONMONO_KNOP: T
    # VEL_LAW=11 + RD_IN_R_GRID=T: MODEL_SPEC ND must equal the RDINR
    # point count, so no boundary insertions are allowed.
    N_OB_INS: 0
    N_IB_INS: 0
    REV_RGRID: F
    FIX_NE: T
    FIX_BA: 1.0D0
    N_FIX_BA: 10
  # Same diagnostics as the TypeIIn_KNOP2 run.
  cmf_flux_param_overrides:
    WR_dFR: T
    WR_IP: T
  mem: 31G
  init_mem: 31G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de

output:
  model_dir: ./SN_A_g_T20k_Ni05_35d
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
