model_name: dessart_m15_2p82d_SOB_jfnk_interactive_spectrum
description: Fresh interactive 3-iteration Dessart m15 SOB smoke run with the
  observer-spectrum step. Uses cmfgen_jfnk commit 01802a6, rebuilt before
  submission. DO_CMF_EW=F selects the compatible Sobolev EW path in cmf_flux.
  USE_JFNK is not enabled because SOB is a separate solver path.
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_SOB_jfnk_interactive_spectrum
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  install_dir: /viper/ptmp2/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 3
  cpus_per_task: 8
  mem: 30G
  vadat_overrides:
    LSTAR: 4.265857D8
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
    MAX_CF: 2.0D2
    DIF: T
    IB_METH: DIFFUSION
    THK_LINE: T
    STOP_IF_BP: F
    FIX_T: T
    FIX_T_AUTO: F
    FIX_IMP: T
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    USE_LAM_ES: T
    SOL_METH: DIAG
    DO_NOMONO_KNOP: F
    DO_NONMONO_KNOP: F
    N_OB_INS: '0'
    N_IB_INS: '0'
    REV_RGRID: F
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
    LAM_SET: F
    USE_J_REL: F
    USE_FRM_REL: F
    USE_DJDT_RTE: F
    INC_GRID: F
    N_TYPE: N_ON_J
    PURE_HUB: F
    VEL_LAW: '11'
    RD_IN_R_GRID: T
    FG_OPT: INT/INS
    USE_FIXED_J: F
    PP_MOD: F
    PP_NOV: F
    AUTO_SMOOTH: F
    NON_MONO_SOLVER: T
    DO_NOMONO_SOB: T
    DO_NONMONO_SOB: T
    DO_NONLOC_SOB: F
    GLOBAL_LINE: SOB
    DO_SOB_LINES: T
    SOB_FREQ_IN_OBS: T
    JBAR_W_EDD: T
    DO_NG: T
    COMP_BA: T
    NUM_LAM: '2'
    LAM_VAL: 2.0D2
    BEG_NG: 1.0D1
    IBEG_NG: '15'
    BA_MAXCH_FAIL: 1.0D30
    REL_OBS: F
    REL_CMF: F
    DO_DDT: F
    INC_ADV: F
    INC_AD: F
    INCL_DJDT: F
    CHK_L_POS: T
    LIN_INT: F
    DO_DIS: T
    INC_PEN: T
    INC_CHG: F
    ALLOW_OL: F
    DC_METH: LTE
    T_INIT_TAU: 1.5D0
    SIG_GAU_KMS: 3.0D3
    INC_RAY: T
    MAX_LIN: 5.0D0
    BA_CHK_FAC: 1.0D-05
    EPS_TERM: 5.0D-02
    BW_NG: '40'
    TRANS_HI: SOB
    TRANS_HeI: SOB
    TRANS_He2: SOB
    TRANS_CIII: SOB
    TRANS_CIV: SOB
    TRANS_CV: SOB
