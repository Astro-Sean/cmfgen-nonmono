model_name: dessart_m15_2p82d_KNOP_MOM_cold
description: KNOP moment-solver cold LTE start, regression check for the
  m15 warm-restart divergence.  The 27-Sep validation of
  MOM_J_CMF_NONMONO_V1 ran this model cold under KNOP+LAM_ES=F and
  contracted (L 2.64E10 -> 1.72E10, demands 4.2E14 -> 4.6E2 over
  it1-3, job 11998572).  The 12-Oct warm probes diverged identically
  under both pathways (12160690 SOB, 12161004 KNOP).  This probe is
  the direct cold-start control on the current build - if it
  contracts like September the moment path is cold-start-only on
  this field; if it diverges too, something since 27-Sep regressed
  the solver (refresh driver, MOM_RF_*/MOM_DAMP_NM/AA changes).
  DO_JFNK=F - admission is gated on USE_LAM_ES anyway.
  Not a production run.
# debug -> interactive partition (1:59 per segment): same testing policy
# as the SOB probes.  Memory is the risk: the KNOP I_NEXT store put the
# LAM probe at ~32G, over the 30G interactive cap; DO_JFNK=F drops the
# JFNK eval machinery which may bring it under.  If submit refuses or
# the job OOMs, resubmit with submission: normal.
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_KNOP_MOM_cold
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  ncf_estimate: 56119
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  non_mono_mode: KNOP
  use_lam_es: false
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 60
  cpus_per_task: 8
  mem: 30G
  final_requeue_when: wall
  final_requeue_max: 500
  # No warm_restart: cold LTE start is the test variable.  N_LAM_RWARM
  # below still forces the early LAMBDA sweeps that build the lagged
  # field, same as the September validation run.
  vadat_overrides:
    LSTAR: 4.265857D8
    RSTAR: 1.454688D4
    RMAX: 8.61436267
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
    MAX_CF: 2.0D2
    DIF: T
    IB_METH: DIFFUSION
    THK_LINE: T
    STOP_IF_BP: F
    FIX_T: T
    FIX_T_AUTO: T
    DO_T_AUTO: T
    FIX_IMP: F
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    USE_LAM_ES: F
    # TRI + NUM_BNDS=3 is the validated KNOP moment pairing; the SOB
    # probe ran DIAG, which is one of the two wiring differences under
    # test.
    SOL_METH: TRI
    DO_NOMONO_KNOP: T
    DO_NONMONO_KNOP: T
    MOM_GATE_BULK: T
    MOM_RF_KEEPNEG: T
    # Absorption-fraction floor in the non-mono MOM diagonal: keeps a
    # J-independent anchor on pure-scattering (ESEC>=CHI) rows so the
    # MOM_LAG_BND clip cannot null their whole lagged source.
    MOM_ABS_FLR: 1.0D-3
    # Implicit lagged-H weight on the MOM diagonal: the clipped shock
    # rows otherwise oscillate between their clipped and unclipped
    # fixed points, pinning the refresh n50 asymptote and the
    # retained-field delta just above the release gate.
    MOM_H_IMPL: T
    # Pin the refresh pass order: the H_IMPL diagonal augmentation
    # shifted cmp_frac below the 0.9 dominance bound, flipping AUTO to
    # alternating D/A passes whose minority-direction Jacobi step
    # re-injects a full pass of error.  DESC keeps the control's order.
    MOM_RF_DIR: DESC
    # Under-relax the Eddington-factor update between great
    # iterations: with pops held, the formal-solve factor snap is the
    # only channel displacing the lagged map's fixed point each sweep
    # (~2.8E5 cells off by >50% while refresh converges at the old
    # factors).  The fixed point is unchanged.
    MOM_FAC_RLX: 5.0D-1
    N_OB_INS: '0'
    N_IB_INS: '0'
    REV_RGRID: F
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
    LAM_SET: F
    USE_J_REL: F
    USE_FRM_REL: F
    USE_DJDT_RTE: F
    INC_GRID: F
    N_TYPE: N_ON_J
    PURE_HUB: F
    RD_IN_R_GRID: T
    FG_OPT: INT/INS
    USE_FIXED_J: F
    PP_MOD: F
    PP_NOV: F
    AUTO_SMOOTH: F
    NON_MONO_SOLVER: T
    DO_NOMONO_SOB: F
    DO_NONMONO_SOB: F
    DO_NONLOC_SOB: F
    GLOBAL_LINE: BLANK
    DO_SOB_LINES: F
    SOB_FREQ_IN_OBS: F
    JBAR_W_EDD: F
    DO_NG: T
    COMP_BA: T
    NUM_LAM: '2'
    LAM_ENTER: 4.0D2
    LAM_EXIT: 5.0D0
    LAM_N_STABLE: '5'
    BA_PROBE_LAM: '0'
    FRESH_BA_EXIT: T
    N_FULL_TREL: '0'
    DO_BA_RES_ACC: T
    BA_RES_GROW: 1.5D0
    BA_RES_HARD: 1.0D2
    BA_TRUST: 1.0D4
    BA_REJ_FRAC: 0.25D0
    BA_NREJ_LIM: '20'
    BA_ENTER_RAW: 1.0D30
    BA_DAMP_CAP: 0.0D0
    BA_SAT_RAW: 2.0D3
    BA_SAT_LIM: '5'
    N_LAM_RWARM: '4'
    MOM_TRIAL_MIN: '30'
    # Same as the warm probe: beyond BA validity the trial takes the
    # damped Lambda probe instead of the always-rejected BA step.
    MOM_TRIAL_LAM: 1.0D3
    GS_FREEZE_LIM: '60'
    GS_TRIAL_LIM: '15'
    GS_REL_STABLE: '1'
    GS_REL_N: '1000000'
    GS_HOLD_POPS: T
    CONV_DIAG_LVL: '1'
    BA_DEM_PFLOOR: 1.0D-30
    # Empty-ion demand rows (depth-62 ~1.6e11% re-fed chatter) pin
    # MAXCH and block the convergence exit; drop rows <1e-6 of
    # depth-max from the metric.  Corrections still commit.
    BA_DEM_RELFRAC: 1.0D-6
    DO_JFNK: F
    JFNK_WARMUP: '0'
    JFNK_ANYITER: T
    JFNK_COUPLED: F
    JFNK_FRZ_GATE: 1.0D30
    JFNK_GATE_NREQ: '1'
    JFNK_LAG_FACTORS: T
    JFNK_COR_GATE: 1.0D30
