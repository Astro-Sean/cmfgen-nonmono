model_name: dessart_m15_2p82d_KNOP_FORMAL_stall
description: 'Stall-relaxation arm of the formal KNOP refresh study: KN_RAY_STALL=0.98 so the NSTALL early exit fires only on nearly flat passes, letting slowly contracting rays use more of KN_RAY_MAXPASS. Proxy-population cold start, 8 iterations, interactive partition. Compare residual, bad-cell fraction, exit census (stall vs cap shift) and wall time vs the control arm; population hold and release gates unchanged.'
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_KNOP_FORMAL_stall
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
