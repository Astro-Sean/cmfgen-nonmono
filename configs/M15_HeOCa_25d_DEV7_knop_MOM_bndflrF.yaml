# Boundary-Eddington floor validation, clean A/B vs bndfix
# (24-Sep-2026).  Identical to M15_HeOCa_25d_DEV7_knop_MOM_bndflr.yaml
# EXCEPT base_dir: the bndflr run was confounded because
# cmfgen_base/MODEL_SPEC was swapped at 13:04 (full 18-species ->
# pruned, He II removed) between the bndfix submission (11:28) and
# the bndflr submission (~13:10).  This config restores the exact
# MODEL_SPEC bndfix ran (full 18-species, NCF=23723) via
# cmfgen_base_fullspec/, giving a pure floor-vs-no-floor A/B.
#
# Binary: cmfgen_nonmono_dev_V7 exe/cmfgen_dev.exe built 24-Sep-2026
# from a CLEAN committed tree, HEAD = 368fa76 (boundary-row HBC
# floor).  Same binary as bndflr.
#
# bndflr (floor + pruned spec) diverged faster than bndfix: L(d=1)
# 3.3E8 -> 3.0E8 -> 2.0E11 -> 2.0E15 -> 2.2E30 by it5, argmax at
# depths 383-448 (inner region, sigma~0) at EUV frequencies, with 15
# non-finite XM writes (bndfix had 0 in 21 its).  This run isolates
# whether the interior explosion is floor-seeded or spec-driven.
#
model_name: M15_HeOCa_25d_DEV7_knop_MOM_bndflrF
description: 'Boundary-HBC-floor clean A/B vs bndfix: identical atomic
  model (full 18-species MODEL_SPEC, NCF=23723) + the floor binary;
  fresh dir.  Isolates the floor from the MODEL_SPEC confound that
  affected bndflr.'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: true
cancel_jobs: true
force_cancel: true
plot_lightcurve: false
submission: debug
hydro_backend: stella

cmfgen_conversion:
  snapshot_days:
  - 25.1
  use_existing_sn_hydro: true

cmfgen:
  base_dir: ./cmfgen_base_fullspec
  model_type: static_snapshot
  init_num_its: 1000
  single_final: true
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: false
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  depth_independent_solver: true
  do_gt_auto: false
  non_mono_mode: KNOP
  vadat_overrides:
    DO_NONMONO_KNOP: T
    USE_LAM_ES: F
    LSTAR: 0.0D0
    VTURB: 50.0D0
    DIF: F
    IB_METH: ZERO_FLUX
    STOP_IF_BP: F
    REV_RGRID: F
    N_OB_INS: 0
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
  mem: 31G
  init_mem: 31G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de

output:
  model_dir: ./dev7_knop_MOM_bndflrF/M15_HeOCa_25d_DEV7_knop_MOM_bndflrF
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
