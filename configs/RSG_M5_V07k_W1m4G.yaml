run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: false
reuse_stella: false
cancel_jobs: true
force_cancel: true
plot_lightcurve: true
submission: normal
debug: false
restart_stella: false
x_model_from_sn:
