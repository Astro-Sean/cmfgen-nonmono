model_name: RSG_M5_V07k_W1m4G
description: 'SN_B interaction-only RSG cocoon model: 5.0 Msun shell at 7000 km/s,
  1e-4 Msun/yr wind, ~330 d SN_A ejecta, with paired wind-only control.'
