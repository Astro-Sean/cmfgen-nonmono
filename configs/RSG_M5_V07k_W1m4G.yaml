  source_age_days: 328.6
  shell_mass_msun: 5.0
  shell_velocity_kms: 7000.0
  shell_composition: solar
  shell_xh: 0.7381
  shell_yhe: 0.2485
  n_rho: 11.0
  v0_kms: 2100.0
  n_T: 0.4
  T_interface_K: 4000.0
  T_max_K: 50000.0
  t_start_days: 1.4
  ejecta_T_floor_K: 2000.0
  ejecta_rho_min: 1.0e-20
  ejecta_v_max_kms: 0.0
  no_wind: false
  se_transition_dex: 0.5
  min_dlogr: 0.005
  max_dlogr: 0.15
  strict_grid: true
  wind_mdot_msun_yr: 0.0001
  wind_velocity_kms: 850.0
  wind_T_K: 4000.0
  explosion_energy: 0.0
  aq: 10.0
  fit_tau: 5.0
  meth: 3
  temp_floor: 0.03
  floor_rad: 0.01
  hmin: 1.0e-14
  hmax: 3600.0
