# SN_B Dessart-2010jl analog grid model: DX14_V8000_sa330
# SEDONA spectrum run on the existing STELLA .swd (reuse_stella).
# Epoch: model day 42.4 = observed +20 d post-peak
#   (model R-band peaks at t=27.3 d; best-fit phase shift is +4.83 d,
#    so obs +20 d -> model t = 27.3 + 20 - 4.83 = 42.4 d).

