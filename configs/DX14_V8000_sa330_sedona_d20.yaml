# SEDONA run on the existing STELLA .swd, day 42.4 (obs +20 d post-peak).
# Settings follow the SN_B_v2_94W sedona smoke test: direct Voigt
# (bound_bound=1) is the non-monotonic-safe opacity path, DDMC=2 so
# line-center photons are not trapped in thick zones, native grid kept.
sedona:
  ntasks: 8
  cpus: 8
  memory: 32G
  use_homologous_expansion: false
  use_nlte: false
  opacity_line_expansion: 0
  opacity_bound_bound: 1
  opacity_fuzz_expansion: 0
  line_velocity_width_kms: 200
  input_source: swd
  nzon_target: 0
  # tau_max trims zones with cumulative tau > tau_max. Photons deeper
  # than tau~10 cannot diffuse out in 42 d; deeper zones only lengthen
  # the DDMC random walks (escape cost scales ~N_zones^2).
  tau_max: 10.0
  # steady_iterate=1: spectra are wiped at each iteration start and
  # T is held fixed (radiative_equilibrium=0), so extra iterations are
  # discarded replicates - a single iteration gives identical output.
  transport_steady_iterate: 1
  core_n_emit: 0
  particles_n_emit_thermal: 1.0e5
  particles_n_emit_radioactive: 1.0e3
  particles_max_total: 2e8
  particles_last_iter_pump: 1
  transport_nu_grid_spacing: 0.001
  transport_nu_min: 1.0e14
  transport_nu_max: 2.0e16
  spectrum_nu_grid_spacing: 0.0005
  transport_radiative_equilibrium: 0
  transport_use_ddmc: 2
  transport_ddmc_tau_threshold: 1.0
output:
  model_dir: ./SN_B_dessart_grid/DX14_V8000_sa330
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
