# TypeIIn CMFGEN at ~10 days post-SBO -- dev7 Knop solver, TRIDIAG +
# USE_LAM_ES=F test (Oct-2026).  KEEPNEG + bulk maturity gate.
#
# Identical setup to TypeIIn_10d_DEV7_KNOP_TRIDIAG_bndflr except:
#   MOM_RF_KEEPNEG: T  -- repaired cells keep the prior J_NEXT
#     iterate (quarantine; repairs never enter the lagged field).
#   MOM_GATE_BULK:  T  -- BA unfreezes on bulk maturity: <=0.1% of
#     cells moving >5%, zero capped writes, max change <0.5,
#     negJ/quarantined fractions <10%.  The default max-norm gate
#     cannot open on this model: a few roaming cells pin it.
#   MOM_RF_GS_DESC: F  -- live descending reads were neutral at
#     best in the gsdesc run.
#   submission: normal.
#
# Fresh directory; cold start (a warm restart would import a
# sibling's diverged J_NEXT_FRQ).  cancel_jobs keys on model_name.
model_name: TypeIIn_10d_DEV7_KNOP_TRIDIAG_gatebulk
description: 'TypeIIn 10d dev7 KNOP + USE_LAM_ES=F (MOM solve),
  MOM_RF_KEEPNEG=T + MOM_GATE_BULK=T: quarantined repair cells plus
  bulk-fraction maturity gate; fresh dir, small partition.'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: false
reuse_stella: true
cancel_jobs: true
force_cancel: true
plot_lightcurve: false
submission: normal
hydro_backend: stella

cmfgen_conversion:
  heracles_dir: heracles
  snapshot_days:
  - 10.0
  epoch_tolerance: 2.0
  stella_source_swd: /viper/ptmp1/sbrennan/SN2024pba/TypeIIn_KNOP2/stella/TypeIIn.swd
  stella_extra_days: 0
  output_file: cmfgen/SN_HYDRO_DATA
  cmfgen_tau_max: 30
  cmfgen_tau_min: 0.01
  n_grid: 100
  adaptive_grid: true
  gradient_threshold: 0.5
  velocity_max_kms: 10000
  v_min_km_s: 2500.0
  opacity_model: stella_nlte
  kappa_constant: 0.34
  enable_grid_thinning: false
  grid_thinning_threshold: 0.005
  enable_adaptive_grid: true
  use_tau_amr: true
  base_grid_method: log_tau
  tau_spacing: auto
  composition_aware: true
  composition_grid_insertion: false
  composition_gradient_threshold: 0.5
  base_grid_target: 100
  max_points: 150
  max_thin_zones: 0
  max_thick_tau: 10000000000.0
  min_points: 80
  min_nd: 80
  sigma_conformance_headroom: 30
  max_radius_jump: 0.05
  max_temp_jump: 0.1
  max_density_jump: 0.15
  smooth_velocity: false
  no_velocity_smoothing: true
  smooth_wiggles: false
  wiggle_window: 5
  velocity_smooth_window_kms: 50.0
  enable_velocity_spacing_optimization: false
  include_ne_amr: false
  max_ne_jump: 0.1
  ionization_front_aware: true
  ionization_front_threshold: 0.5
  ionization_front_min_points: 5
  ionization_front_width: 3
  ionization_front_cap: 0.15
  resolve_recombination_fronts: true
  recombination_t_jump: 0.3
  recombination_front_width: 5
  max_logtau_jump: 0.25
  max_velocity_jump: 0.3
  max_sigma_jump: 2.0
  max_cell_ratio: 2.0
  thin_grid_tau: 1.0
  thin_grid_priority: 1.0
  outer_boundary_extra_points: 5
  outer_boundary_ratio: 1.5
  min_dr_r: 0.0001
  max_dr_r: 0.15
  sigma_priority_threshold: 1.0
  sigma_priority: 2.0
  dsigma_priority_threshold: 0.3
  dsigma_priority: 2.0
  smooth_sigma: false
  smooth_sigma_scatter: false
  max_dsigma: 1.0
  sigma_smooth_passes: 10
  sigma_smooth_window: 0.3
  smooth_sigma_global: false
  sigma_global_window: 7
  sigma_global_max_rel_change: 0.05
  trace_threshold: 1.0e-06

cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 200
  single_final: true
  cpus_per_task: 4
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: true
  vturb: 20.0
  incl_rel: false
  # VEL_LAW=11 (SET_RV_HYDRO_MODEL_V3): reads R from RDINR and interpolates
  # V directly from SN_HYDRO_DATA — required for the non-monotonic
  # velocity field (VEL_LAW=12 is homologous and cannot represent it).
  vel_law: 11
  # TRIDIAG BA solve: SOL_METH=TRI + NUM_BNDS=3 (run_model_grid stamps
  # SOL_METH=TRI from this flag; apply_profile/reconcile sets NUM_BNDS=3).
  depth_independent_solver: false
  # Dev7 Knop et al. (2009) non-monotonic formal solver
  # (FG_J_CMF_NONMONO_V1) + GLOBAL_LINE=BLANK. The control run
  # (job 11819295) converged on this mode with identical physics.
  non_mono_mode: KNOP
  do_gt_auto: false
  # proxy_populations MUST stay off here: it writes species *_IN files
  # and submit_cmfgen.sh then forces LTE_EST=F to read them. The user
  # directive for test runs is LTE_EST=T (LTE cold start).
  proxy_populations: false
  # A-priori MODEL_SPEC pruning: prune_stalled_levels.py --prior runs
  # after SN_HYDRO_DATA is ready and before submission, trimming
  # Boltzmann-dead, non-line-forming tail superlevels that otherwise
  # pin MAXCH at the per-depth SCALE cap (e.g. O II 2s2p4 SL4/SL5).
  prune_model_spec: true
  vadat_overrides:
    LSTAR: 0.0D0
    VTURB: 20.0D0
    # RT sub-grid refinement test result (23-Sep-2026): VFRAC_MOM=0.1
    # dropped |EPS|/HU ~6x but not below 1; SIGMA_TRUE is interpolated
    # onto the sub-grid so the unstable zone got ~6x MORE cells
    # (ND_NM 724->4093, negJ 1e6->10.5M, MOM_J_NONMONO_ERRORS >7GB).
    # Refinement to |EPS|/HU<1 needs ~0.04 -> ND_NM~25k, over the 30G
    # cap. Reverted to 1.0: this run isolates LTE_EST=T (user directive)
    # against the DGTSV baseline which used proxy populations.
    VFRAC_MOM: 1.0D0
    # Test runs always use LTE initial populations (user directive).
    LTE_EST: T
    # Ejecta-only boundary (19-Sep-2026): tau_inner=28.6 < 50 so the
    # DIFFUSION BC is outside its validity range -- the pipeline warns it
    # can produce a negative or blown-up inner-boundary J, and OUTGEN
    # showed DTDR=0 at the boundary on it1. ZERO_FLUX matches LSTAR=0.
    DIF: F
    IB_METH: ZERO_FLUX
    STOP_IF_BP: F
    # T structure comes from the shocked hydro — hold it fixed.
    FIX_T: T
    FIX_T_AUTO: F
    FIX_IMP: T
    # Start in Lambda mode, auto-switch to BA at MAXCH<50% (verified
    # non-mono default). DO_LAM_AUTO=F would stay Lambda forever and the
    # BA-mode FIX_BA/N_FIX_BA controls would never be exercised.
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    # Explicit KNOP activation (both spellings: the orchestrator reads
    # DO_NOMONO_KNOP to enter the non-mono block; the dev7 binary reads
    # DO_NONMONO_KNOP).
    DO_NOMONO_KNOP: T
    DO_NONMONO_KNOP: T
    # USE_LAM_ES=F: J from MOM_J_CMF_NONMONO_V1 (non-monotonic moment
    # solver) instead of the formal-solution Lambda value. Valid under
    # KNOP since 19-Sep-2026; not force-corrected by the pipeline.
    USE_LAM_ES: F
    # MOM refresh test (Oct-2026): on descending refresh passes the
    # compressing-depth read of J_NEXT_FRQ(:,L+1) uses the live value
    # already updated this pass -- true GS propagation along the
    # red-to-blue compressing characteristic.  The frozen snapshot
    # limits propagation to one bin per pass and cannot converge a
    # coupling spanning more bins than KN_M_MAXPASS=60.  Containment:
    # the abort guard plus the pre-refresh field restore bound any
    # recurrence of the 11887664 cascade.
    MOM_RF_GS_DESC: F
    MOM_RF_KEEPNEG: T
    # Bulk-aware MOM maturity gate (Oct-2026): BA unfreezes on
    # sweep-level field drift (fresh solve vs stored J_NEXT), not the
    # refresh residual -- the refresh measures lagged-map
    # self-consistency, which asymptotes on marginally contractive
    # compressing cells.  Freeze while >10% of cells drift >5% per
    # sweep; unsafe on capped writes, >0.1% of cells drifting >50%,
    # any cell >10x stored, negJ/quar fractions >10%, or a refresh
    # residual >1e2.
    MOM_GATE_BULK: T
    # VEL_LAW=11 + RD_IN_R_GRID=T: MODEL_SPEC ND must equal the RDINR
    # point count, so no boundary insertions are allowed.
    N_OB_INS: 0
    N_IB_INS: 0
    REV_RGRID: F
    # FIX_NE=F (project default, 25-Sep-2026): Ne solved from charge
    # conservation. The 19-Sep FIX_NE=T test pinned Ne to isolate the
    # it9 divergence driver (var 194, electron density); test concluded.
    FIX_NE: F
    # Stall fix (18-Sep-2026): FIX_BA=15 + N_FIX_BA=0 froze the Jacobian
    # permanently once MAXCH<15% -- the M15 runs plateaued at ~0.357.
    # N_FIX_BA=10 gave an 11-iteration stale-Jacobian window in which the
    # DEC channel diverged (17%->49% at the d30 ionization front) until the
    # next refresh. N_FIX_BA=2 refreshes every 3rd iteration (the manual's
    # recommended value); the BA build is cheap relative to the ~650 s
    # Knop I_NEXT refresh that dominates each iteration.
    FIX_BA: 1.0D1
    N_FIX_BA: 2
    # ES stability test (22-Sep-2026): non-coherent electron scattering
    # during convergence. prepare_VADAT.py would otherwise stamp
    # COH_ES=T; explicit vadat_overrides win over that default. The
    # off-diagonal frequency redistribution couples the SE system more
    # strongly, so slower iterations / possible instability are the
    # expected failure mode this run is checking for.
    COH_ES: F
    MIX_COH: F
    # EPS_TERM=1e-2 requires MAXCH<0.01% -- unreachable while the lagged
    # Knop field carries a ~2e-2 residual at |Q|->1 compression cells.
    # 1.0 terminates at the stated <1% target.
    EPS_TERM: 1.0D0
    # NG off (24-Sep-2026): NG extrapolation kicked the sibling ES run
    # by +87%/-413% at near-converged MAXCH, each forcing a LAMBDA
    # fallback and re-convergence; two earlier attempts failed outright
    # ("Too many bad NG accelerations"). The kicks cost more than they save.
    DO_NG: F
    # Deliberately NO LAM_SCALE_OPT=LIMIT (user directive 18-Sep-2026):
    # the correction clip only masks divergence. If the model diverges,
    # the cause is elsewhere (J at reversal depths, boundary sigma,
    # initial populations) and must surface, not be damped away.
  # Diagnostic: dump per-radius flux contributions (dFR_DATA) and
  # emergent intensity per impact parameter (IP_DATA) so the spurious
  # blue-wing emission on non-monotonic rays can be localized to a
  # radius/velocity. Temporarily enabled for the blue-component fix.
  cmf_flux_param_overrides:
    WR_dFR: T
    WR_IP: T
    # Non-coherent ES wings must extend beyond VINF (~10472 km/s); the
    # obs_template default of 2500 km/s would clip them. Matches the
    # raised value already in VADAT_INIT.
    ES_WING_EXT: 12000.0
    R_CMF_WING_EXT: 3.0
  mem: 31G
  init_mem: 31G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de

output:
  model_dir: ./TypeIIn_KNOP_TRIDIAG_gatebulk
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
