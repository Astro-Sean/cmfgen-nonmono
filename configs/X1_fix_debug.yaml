model_name: X_1_fix
description: 'X_1 with Si II atomic data fix: 3s3p2 doubly-excited states moved to
  LTE to prevent convergence cascade'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
reuse_stella: true
ejecta:
  M_ejecta_A: 3.0
  R_star_cm: 5.0e13
  n_shell: 2.0
  V_ejecta_A_initial_kms: 5000.0
  transition_AB_width_fraction: 2.0
  transition_AB_sigmoid_k: 25
  fx_H_A: 0.7
  fx_He_A: 0.28
  fx_O_A: 0.009
  fx_Si_A: 0.0007
  fx_Ca_A: 0.0002
  fx_Fe_A: 0.0013
  M_ejecta_B: 2.0
  days_ejecta_B: 400
  E_kin_ejecta_B: 0
  V_ejecta_B_max_kms: 10000
  fx_H_B: 0.02
  fx_He_B: 0.38
  fx_O_B: 0.18
  fx_Si_B: 0.07
  fx_Ca_B: 0.02
  fx_Fe_B: 0.07
  fx_Ni_B: 0.0
  wind_velocity_type: beta_law
  Mdot_wind: 0.0
  V_inf_kms: 250.0
  beta_wind: 5.0
  wind_time_days: 400
  fx_H_wind: 0.7
  fx_He_wind: 0.28
  N_rho_ejecta_B: 4
  n_cells: 10000
  stationary_ejecta_A: true
  sigmoid_k: 20
hydro_backend: stella
stella:
  convection: false
  target_days: 50.0
  nzon: 500
  kappa: 0.34
  snapshot_interval: 1.0
  iout: 10
  r_min: 1e12
  stella_root: /ptmp/sbrennan/stella/OpenStella
  partition: general
  memory: 16G
  time: '23:59:00'
  outer_fraction: 0.3
  transition_radius: 1e13
  explosion_energy: 0.0
  explosion_mass: 0.0
  explosion_time: 10.0
  explosion_delay: 0.0
  initial_kinetic_energy: 0.0
  nstmax: 2000000
  eps: 0.003
  hmax: 3600.0
  meth: 3
  fit_tau: 15.0
  tau_tol: 1.3
  disable_scattering: false
  stella_tau_min: 1e-4
  wacc_r: 1.0
  wacc_v: 1.0
  wacc_t: 1.0
  wacc_rad: 1.0
  temp_floor: 0.2
  use_ronfict: true
  nickel56:
    enabled: false
    ejecta_a:
      total_mass_msun: 0.0
      distribution_mass_msun: 0.5
      distribution_type: uniform
      inner_zone_fraction: 0.4
    ejecta_b:
      total_mass_msun: 0.0017
      distribution_mass_msun: 2.0
      distribution_type: uniform
      inner_zone_fraction: 1.0
temperature:
  temp_profile_type: adiabatic
  N_T_ejecta: 0.6
  T_inner_max: 100000
  T_csm: 5000
cmfgen_conversion:
  heracles_dir: heracles
  snapshot_days:
  - 30
  stella_extra_days: 10
  output_file: cmfgen/SN_HYDRO_DATA
  cmfgen_tau_max: 30
  cmfgen_tau_min: 1e-3
  n_grid: 100
  adaptive_grid: true
  gradient_threshold: 0.5
  velocity_max_kms: 10000
  opacity_model: stella_nlte
  kappa_constant: 0.34
  enable_grid_thinning: true
  grid_thinning_threshold: 0.005
  enable_adaptive_grid: true
  base_grid_target: 80
  max_points: 500
  min_points: 100
  min_nd: 100
  enforce_homologous: false
  sigma_warn_fraction: 0.2
  thin_grid_tau: 1.0
  thin_grid_priority: 0.5
  outer_boundary_extra_points: 5
  outer_boundary_ratio: 1.5
  sigma_priority_threshold: 2.0
  sigma_priority: 1.0
  dsigma_priority_threshold: 0.5
  dsigma_priority: 1.0
  max_radius_jump: 0.05
  max_temp_jump: 0.1
  max_density_jump: 0.15
  smooth_velocity: false
  no_velocity_smoothing: true
  enable_velocity_spacing_optimization: false
  include_ne_amr: true
  max_ne_jump: 0.1
  ne_priority_threshold: 1.0
  ne_priority: 8.0
  max_logtau_jump: 0.1
  max_velocity_jump: 0.3
  max_sigma_jump: 5.0
  max_abs_sigma: 100.0
  sigma_optimize: false
  sigma_conformance_headroom: 0
  smooth_sigma: true
  max_dsigma: 1.0
  sigma_smooth_passes: 10
  sigma_smooth_window: 0.3
  base_grid_method: tau_amr_recursive
cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 25
  vel_law: 12
  target_nd: 150
  proxy_populations: false
  inc_rad_decays: true
  vturb: 20.0
  incl_rel: false
  vadat_overrides:
    OB_RAT: 1.0D0
    STOP_IF_BP: F
    THK_CONT: F
    DIF: T
    IB_METH: DIFFUSION
    FIX_T: T
    FIX_T_AUTO: F
  partition: general
  time: '23:59:00'
  mem: 16G
  init_mem: 16G
  init_partition: general
  init_time: '23:59:00'
  n_ob_ins: 30
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
sedona:
  partition: general
  cpus: 4
  memory: 30G
  time: '23:59:00'
  use_homologous_expansion: false
  use_nlte: false
  opacity_line_expansion: 0
  opacity_bound_bound: 1
  opacity_fuzz_expansion: 0
  line_velocity_width_kms: 200
  nzon_target: 0
  transport_steady_iterate: 30
  ntasks: 4
  core_n_emit: 5e5
  particles_n_emit_thermal: 5e6
  particles_n_emit_radioactive: 5e4
  particles_max_total: 2e8
  particles_last_iter_pump: 10
  transport_nu_grid_spacing: 0.001
  transport_nu_min: 2.5e14
  transport_nu_max: 1.2e15
  spectrum_nu_grid_spacing: 0.0005
  transport_radiative_equilibrium: 1
  transport_use_ddmc: 2
  transport_ddmc_tau_threshold: 10.0
superlite:
  partition: general
  ntasks: 1
  cpus_per_task: 8
  memory: 16G
  time: '23:59:00'
  install_dir: /ptmp/sbrennan/superlite
  exe: /ptmp/sbrennan/superlite/superlite
  truncate_tau: 20
output:
  model_dir: ./models/${model_name}
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: outputs
heracles:
  mode: hydrorad
  simulation_days: 50
  target_days: 100
  heracles_dir: ../heracles/hydro
  output_dir: ../heracles/hydro
  Lbox_cm: 5.0e17
  r_inner_cm: 1.0e7
  r_transition_cm: 1.0e12
  nx_inner_linear: 3000
  nx_hybrid_blend: 0
  hybrid_sigmoid_k: 10
  dt_max: 30
  nout: 100
  partition: general
  cpus: 2
  memory: 16G
  time: '23:58:00'
debug: true
