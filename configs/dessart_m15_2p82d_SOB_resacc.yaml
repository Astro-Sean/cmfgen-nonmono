model_name: dessart_m15_2p82d_SOB_resacc
description: 'Identical to dessart_m15_2p82d_SOB except DO_BA_RES_ACC=T
  (BA_RES_GROW=1.5, BA_RES_HARD=100, BA_TRUST=1e4 -- all defaults).  The
  baseline run settled into a strict 2-cycle: BA-step its ~400% max
  correction at d~50, Lambda-step its ~129%.  Residual acceptance
  compares the post-BA-step SE residual on the following iteration and
  rejects+restores POPS when it grows, so it directly tests whether the
  BA overshoot drives the cycle.  Cold start, normal partition.'
submission: normal
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_SOB_resacc
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 1000
  cpus_per_task: 16
  mem: 30G
  vadat_overrides:
    # Luc's VADAT sets LSTAR=4.265857e8 (the SN_HYDRO_DATA header Energy
    # Lum).  The diffusion inner BC needs a nonzero LSTAR to anchor the
    # deep radiation field; LSTAR=0 gave DTDR=0 at every iteration.
    LSTAR: 4.265857D8
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
    MAX_CF: 2.0D2
    # Luc ran DIF=T (diffusion inner BC).  Inner Rosseland tau=37 matches
    # the paper's tau~30 truncation; ZERO_FLUX is the thin-boundary option.
    DIF: T
    IB_METH: DIFFUSION
    THK_LINE: T
    STOP_IF_BP: F
    FIX_T: T
    FIX_T_AUTO: F
    FIX_IMP: T
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    USE_LAM_ES: T
    SOL_METH: DIAG
    DO_NOMONO_KNOP: F
    DO_NONMONO_KNOP: F
    N_OB_INS: '0'
    N_IB_INS: '0'
    REV_RGRID: F
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
    # 2-cycle test (28-Sep-2026): residual acceptance on BA steps. The
    # tracker arms only on non-LAMBDA solves, which matches this run's
    # alternating BA/Lambda schedule.
    DO_BA_RES_ACC: T
    BA_RES_GROW: 1.5D0
    BA_TRUST: 1.0D4
    LAM_SET: F
    USE_J_REL: F
    USE_FRM_REL: F
    USE_DJDT_RTE: F
    INC_GRID: F
    N_TYPE: N_ON_J
    # NEG_OPAC_OPT is forced SRCE_CHK by the shared NON_MONO table
    PURE_HUB: F
    VEL_LAW: '11'
    RD_IN_R_GRID: T
    FG_OPT: INT/INS
    USE_FIXED_J: F
    PP_MOD: F
    PP_NOV: F
    AUTO_SMOOTH: F
    NON_MONO_SOLVER: T
    DO_NOMONO_SOB: T
    DO_NONMONO_SOB: T
    DO_NONLOC_SOB: F
    GLOBAL_LINE: SOB
    DO_SOB_LINES: T
    SOB_FREQ_IN_OBS: T
    # JBAR_W_EDD=T restores the standard line-dJ Eddington path; the F
    # workaround was only needed because PERTJFEAU_IBC stops under DIF=F.
    JBAR_W_EDD: T
    DO_NG: T
    COMP_BA: T
    NUM_LAM: '2'
    LAM_VAL: 2.0D2
    BEG_NG: 1.0D1
    IBEG_NG: '15'
    BA_MAXCH_FAIL: 1.0D30
    REL_OBS: F
    REL_CMF: F
    DO_DDT: F
    INC_ADV: F
    INC_AD: F
    INCL_DJDT: F
    CHK_L_POS: T
    LIN_INT: F
    # Match Luc's physics/process toggles where the profile had them off.
    DO_DIS: T
    INC_PEN: T
    INC_CHG: F
    ALLOW_OL: F
    DC_METH: LTE
    T_INIT_TAU: 1.5D0
    SIG_GAU_KMS: 3.0D3
    INC_RAY: T
    MAX_LIN: 5.0D0
    BA_CHK_FAC: 1.0D-05
    EPS_TERM: 5.0D-02
    BW_NG: '40'
    TRANS_HI: SOB
    TRANS_HeI: SOB
    TRANS_He2: SOB
    TRANS_CIII: SOB
    TRANS_CIV: SOB
    TRANS_CV: SOB
    TRANS_NIII: SOB
    TRANS_NIV: SOB
    TRANS_NV: SOB
    TRANS_O2: SOB
    TRANS_OIII: SOB
    TRANS_OIV: SOB
    TRANS_OV: SOB
    TRANS_OSIX: SOB
    TRANS_NeIII: SOB
    TRANS_NeIV: SOB
    TRANS_NeV: SOB
    TRANS_MgIII: SOB
    TRANS_MgIV: SOB
    TRANS_MgV: SOB
    TRANS_AlIII: SOB
    TRANS_AlIV: SOB
    TRANS_AlV: SOB
    TRANS_SkIII: SOB
    TRANS_SkIV: SOB
    TRANS_SkV: SOB
    TRANS_SIII: SOB
    TRANS_SIV: SOB
    TRANS_SV: SOB
    TRANS_ArIII: SOB
    TRANS_ArIV: SOB
    TRANS_ArV: SOB
    TRANS_ArSIX: SOB
    TRANS_CaIII: SOB
    TRANS_CaIV: SOB
    TRANS_CaV: SOB
    TRANS_CaSIX: SOB
    TRANS_TkIII: SOB
    TRANS_TkIV: SOB
    TRANS_CrIII: SOB
    TRANS_CrIV: SOB
    TRANS_CrV: SOB
    TRANS_CrSIX: SOB
    TRANS_FeIII: SOB
    TRANS_FeIV: SOB
    TRANS_FeV: SOB
    TRANS_FeSIX: SOB
    TRANS_FeSEV: SOB
  cmf_flux_param_overrides:
    WR_dFR: true
    WR_IP: true
  notification_email: sbrennan@mpe.mpg.de
