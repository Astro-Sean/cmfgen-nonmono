  initial_kinetic_energy: 0.0
  nstmax: 2000000
  eps: 0.003
  hmax: 3600.0
  hmin: 1.0e-14
  meth: 3
  aq: 10.0
  bq: 1.0
  fit_tau: 5.0
  tau_tol: 1.3
