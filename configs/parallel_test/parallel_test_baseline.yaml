  stella_tau_min: 0.0001
  wacc_r: 1.0
  wacc_v: 1.0
  wacc_t: 0.5
  wacc_rad: 0.5
  temp_floor: 0.03
  floor_rad: 0.01
  use_ronfict: true
  nickel56:
    enabled: true
    total_mass_msun: 0.0001
    distribution_mass_msun: 0.5
    distribution_type: uniform
    inner_zone_fraction: 0.15
  cpus_per_task: 1
temperature:
  temp_profile_type: adiabatic
  N_T_ejecta: 0.6
  T_inner_max: 100000
  T_csm: 5000
cmfgen_conversion:
