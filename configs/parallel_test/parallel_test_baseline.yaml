  model_type: static_snapshot
  partition: general
  time: '23:59:00'
  init_num_its: 1000
  single_final: true
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V3
