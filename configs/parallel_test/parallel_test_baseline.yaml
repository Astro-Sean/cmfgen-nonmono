  target_days: 8.0
  nzon: 500
  kappa: 0.34
  snapshot_interval: 0.5
  iout: 10
  r_min: 0.0
  rho_min: 0.0
  stella_root: /ptmp/sbrennan/stella/OpenStella
  allow_serial_stella: true   # serial baseline for parallel comparison
  partition: general
  memory: 16G
  time: '23:59:00'
  outer_fraction: 0.3
  transition_radius: 10000000000000.0
  explosion_energy: 0.0
  explosion_mass: 0.0
  explosion_time: 1.0
