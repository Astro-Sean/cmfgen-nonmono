    OB_RAT: 1.0D0
    STOP_IF_BP: F
    THK_CONT: F
    IB_STAB: 0.0D0
    DIF: T
    IB_METH: DIFFUSION
    USE_LAM_ES: T
    FIX_NE: F
    FIX_T: T
    FIX_T_AUTO: T
    FIX_IMP: T
    DO_LAM_AUTO: T
    DO_LAM_IT: T
    DO_NG: T
    SOL_METH: DIAG
    N_IB_INS: '0'
    N_OB_INS: '5'
    BA_CHK_FAC: 1.0D-05
    REV_RGRID: F
    MIN_CF: 3.0D-3
    T_INIT_TAU: 1.5D0
    MAX_LAM: 1.0D10
    MAX_LIN: 5.0D0
    LAM_VAL: 2.0D2
    NUM_LAM: '10'
    N_FIX_BA: '2'
    ALL_FREQ: F
    AUTO_SMOOTH: F
    DO_AV: F
    NEW_LINE_BA: T
    IND_BA_METH: '45'
    BEG_NG: 1.0D-01
    IBEG_NG: '20'
    BW_NG: '40'
    NON_MONO_SOLVER: T
    ITS/NG: '8'
    T_ON_R: T
    SCL_SL_OPAC: T
    SCL_LN: F
    INC_GRID: F
    ST_INT: '40'
    END_INT: '55'
    IT_ON_T: T
    VFRAC_MOM: 5.0D0
    VFRAC_FG: 1.0D0
    LAM_SCALE_OPT: NONE
  iteration_strategy:
  - LAMBDA(FIXT) 20
  - DO_NG
  - LAMBDA(FIXT) 20
  - DO_NG
  - NORM
  adjust_corrections:
    l_st: 1
    l_end: 160
    relax: 0.5
    t_lim: 0.2
    max_chng: 3.0
    consis_cnt: 0
  mem: 31G
  init_mem: 31G
  init_partition: general
  init_time: '23:59:00'
  n_ob_ins: 5
  final_requeue_when: never
  final_requeue_max: 0
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de
output:
  model_dir: ./parallel_test_baseline
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
submission: normal
