model_name: dessart_m15_2p82d_SOB
description: Dessart m15 step10 (2.824d) hydro snapshot run with the original
  Dessart+2015 Sobolev non-monotonic tau floor (VEL_LAW=11 + SN_HYDRO_DATA +
  RDINR, DO_NONMONO_SOB=T, GLOBAL_LINE=SOB, no RH78 non-local coupling).
  FIX_NE=F variant matching the FreeNe_v2 siblings. Boundary/physics keys
  now mirror Luc's converged VADAT in cmfgen_validation/jnk_extracted.
  DIF=T + LSTAR=4.265857e8 (diffusion inner BC, SN_HYDRO_DATA header
  luminosity), JBAR_W_EDD=T (PERTJFEAU_IBC requires DIF=T), THK_LINE=T,
  DO_DIS=T, INC_PEN=T, ALLOW_OL=F, DC_METH=LTE, INC_CHG=F (no CHG_EXCH_DATA),
  NEG_OPAC_OPT stays forced SRCE_CHK. The prior ZERO_FLUX + LSTAR=0 setup diverged at
  it1 and crashed at it11 (GFF_VEC NaN T). Rebuilt cmfgen_nonmono_dev_V7.
submission: normal
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_knop_SOB
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 1000
  cpus_per_task: 16
  mem: 30G
  vadat_overrides:
    # Luc's VADAT sets LSTAR=4.265857e8 (the SN_HYDRO_DATA header Energy
    # Lum).  The diffusion inner BC needs a nonzero LSTAR to anchor the
    # deep radiation field; LSTAR=0 gave DTDR=0 at every iteration.
    LSTAR: 4.265857D8
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
    MAX_CF: 2.0D2
    # Luc ran DIF=T (diffusion inner BC).  Inner Rosseland tau=37 matches
    # the paper's tau~30 truncation; ZERO_FLUX is the thin-boundary option.
    DIF: T
    IB_METH: DIFFUSION
    THK_LINE: T
    STOP_IF_BP: F
    FIX_T: T
    FIX_T_AUTO: F
    FIX_IMP: T
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    USE_LAM_ES: T
    SOL_METH: DIAG
    DO_NOMONO_KNOP: F
    DO_NONMONO_KNOP: F
    N_OB_INS: '0'
    N_IB_INS: '0'
    REV_RGRID: F
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
    LAM_SET: F
    USE_J_REL: F
    USE_FRM_REL: F
    USE_DJDT_RTE: F
    INC_GRID: F
    N_TYPE: N_ON_J
    # NEG_OPAC_OPT is forced SRCE_CHK by the shared NON_MONO table
    PURE_HUB: F
    VEL_LAW: '11'
    RD_IN_R_GRID: T
    FG_OPT: INT/INS
    USE_FIXED_J: F
    PP_MOD: F
    PP_NOV: F
    AUTO_SMOOTH: F
    NON_MONO_SOLVER: T
    DO_NOMONO_SOB: T
    DO_NONMONO_SOB: T
    DO_NONLOC_SOB: F
    GLOBAL_LINE: SOB
    DO_SOB_LINES: T
    SOB_FREQ_IN_OBS: T
    # JBAR_W_EDD=T restores the standard line-dJ Eddington path; the F
    # workaround was only needed because PERTJFEAU_IBC stops under DIF=F.
    JBAR_W_EDD: T
    DO_NG: T
    COMP_BA: T
    NUM_LAM: '2'
    LAM_VAL: 2.0D2
    BEG_NG: 1.0D1
    IBEG_NG: '15'
    BA_MAXCH_FAIL: 1.0D30
    REL_OBS: F
    REL_CMF: F
    DO_DDT: F
    INC_ADV: F
    INC_AD: F
    INCL_DJDT: F
    CHK_L_POS: T
    LIN_INT: F
    # Match Luc's physics/process toggles where the profile had them off.
    DO_DIS: T
    INC_PEN: T
    INC_CHG: F
    ALLOW_OL: F
    DC_METH: LTE
    T_INIT_TAU: 1.5D0
    SIG_GAU_KMS: 3.0D3
    INC_RAY: T
    MAX_LIN: 5.0D0
    BA_CHK_FAC: 1.0D-05
    EPS_TERM: 5.0D-02
    BW_NG: '40'
    TRANS_HI: SOB
    TRANS_HeI: SOB
    TRANS_He2: SOB
    TRANS_CIII: SOB
    TRANS_CIV: SOB
    TRANS_CV: SOB
    TRANS_NIII: SOB
    TRANS_NIV: SOB
    TRANS_NV: SOB
    TRANS_O2: SOB
    TRANS_OIII: SOB
    TRANS_OIV: SOB
    TRANS_OV: SOB
    TRANS_OSIX: SOB
    TRANS_NeIII: SOB
    TRANS_NeIV: SOB
    TRANS_NeV: SOB
    TRANS_MgIII: SOB
    TRANS_MgIV: SOB
    TRANS_MgV: SOB
    TRANS_AlIII: SOB
    TRANS_AlIV: SOB
    TRANS_AlV: SOB
    TRANS_SkIII: SOB
    TRANS_SkIV: SOB
    TRANS_SkV: SOB
    TRANS_SIII: SOB
    TRANS_SIV: SOB
    TRANS_SV: SOB
    TRANS_ArIII: SOB
    TRANS_ArIV: SOB
    TRANS_ArV: SOB
    TRANS_ArSIX: SOB
    TRANS_CaIII: SOB
    TRANS_CaIV: SOB
    TRANS_CaV: SOB
    TRANS_CaSIX: SOB
    TRANS_TkIII: SOB
    TRANS_TkIV: SOB
    TRANS_CrIII: SOB
    TRANS_CrIV: SOB
    TRANS_CrV: SOB
    TRANS_CrSIX: SOB
    TRANS_FeIII: SOB
    TRANS_FeIV: SOB
    TRANS_FeV: SOB
    TRANS_FeSIX: SOB
    TRANS_FeSEV: SOB
  cmf_flux_param_overrides:
    WR_dFR: true
    WR_IP: true
  notification_email: sbrennan@mpe.mpg.de
