# Boundary-Eddington floor validation run (24-Sep-2026): identical
# setup to M15_HeOCa_25d_DEV7_knop_MOM_bndfix.yaml, fresh model dir.
#
# Binary: cmfgen_nonmono_dev_V7 exe/cmfgen_dev.exe built 24-Sep-2026
# from a CLEAN committed tree, HEAD = 368fa76 (boundary-row HBC floor:
# local HBC_ROW = max(HBC,0) / HBC_PREV_ROW = max(HBC_PREV,0) applied
# to A_BND, the boundary diagonal, and PSIPREV in the OUT_BC_TYPE<=1
# row; HBC_CMF untouched).  Earlier commits in the build: 36b03eb (F1),
# d8507dc (F3), 257ef3b (F4), plus the committed WIP fixes 504e4c9,
# 5829cf7, 080fbc6, 026195c, 619dc3a, fc5ed0e.
#
# Validation target: the bndfix run (jobs 11960113/11960114) diverged
# through the compressing boundary branch because HBC < 0 dropped the
# row diagonal below |A_bnd|.  A correct floor should keep the lagged
# J_next weight <= 1: GS max rel. change should contract, argmax
# should leave depth 1, L(d=1) should not run away negative, and
# depth-1 MOM_J_NONMONO_ERRORS should stay absent.  Floored
# frequencies are logged in MOM_BND_HBC_FLOOR.
#
# Model itself is monotonic (sigma ~ 0): only the boundary-row branch
# is exercised, which is what this change fixes.  The compressing-zone
# J_NEXT branch is not tested here.
#
model_name: M15_HeOCa_25d_DEV7_knop_MOM_bndflr
description: 'Post-F1/F3/F4 boundary-HBC-floor validation: M15-He-O-Ca-evo
  snapshot at 25.10 d with DO_NONMONO_KNOP=T and USE_LAM_ES=F on the
  clean-built dev7 binary (HBC_ROW floor in the boundary row); fresh dir
  for A/B vs the bndfix run.'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: true
cancel_jobs: true
force_cancel: true
plot_lightcurve: false
submission: debug
hydro_backend: stella

cmfgen_conversion:
  snapshot_days:
  - 25.1
  use_existing_sn_hydro: true

cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 1000
  single_final: true
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: false
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  depth_independent_solver: true
  do_gt_auto: false
  non_mono_mode: KNOP
  vadat_overrides:
    DO_NONMONO_KNOP: T
    USE_LAM_ES: F
    LSTAR: 0.0D0
    VTURB: 50.0D0
    DIF: F
    IB_METH: ZERO_FLUX
    STOP_IF_BP: F
    REV_RGRID: F
    N_OB_INS: 0
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
  mem: 31G
  init_mem: 31G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de

output:
  model_dir: ./dev7_knop_MOM_bndflr/M15_HeOCa_25d_DEV7_knop_MOM_bndflr
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
