model_name: dessart_m15_2p82d_SOB_l14_lte
description: >
  Fresh LTE cold start (LTE_EST=T) of the l14 SOB model on commit
  39b94dff.  No warm restart: fresh directory, no checkpoint, no
  FGINEXT store.  ESEC_CHK + BA_DEM_PFLOOR=1e-30 + Stage-B polish
  (BA_TR_MAXSWP=3) + exit-only BA_EX_RELFRAC=1e-6, so majors gate
  the metric and dead-stage trace rows get the bounded polish and a
  loudly reported exit release.  DO_JFNK=T with frozen tier.
submission: normal
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_SOB_l14_lte
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 14
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 1000
  cpus_per_task: 8
  mem: 30G
  allow_dead_inner_boundary: false
  obs_line_treatment: blank
  obs_partition: general
  obs_mem: 60G
  final_requeue_when: wall
  final_requeue_max: 500
  warm_restart: false
  vadat_overrides:
    # LTE cold start: no _IN files, CMFGEN builds LTE estimates.
    LTE_EST: T
    LSTAR: 4.265857D8
    CL_LAW: EXPO
