# Test B (review 18-Sep-2026): LAMBDA -> DIAG BA with NO BA-matrix reuse.
# STORE_BA=F, STORE_BA_INV=F, WR_PRT_INV=F, N_FIX_BA=0 force the BA matrix
# and inverse to be recomputed every BA iteration (a stale Jacobian is a
# suspected divergence source).  NG/Anderson already off (DO_NG=F, DO_AA=F).

