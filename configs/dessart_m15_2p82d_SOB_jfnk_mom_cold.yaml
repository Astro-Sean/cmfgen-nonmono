model_name: dessart_m15_2p82d_SOB_jfnk_mom_cold
description: Cold LTE start of the m15 2.82d validated Dessart Sobolev path.
  Uses the hydro radius grid and formal-solution Lambda transport required by
  the non-monotonic SOB setup. The earlier moment-solver probe converged, but
  its VEL_LAW=14 tau grid and USE_LAM_ES=F setup was not the validated model.
# debug -> interactive partition (1:59 per segment) for fast queue turnaround.
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_SOB_jfnk_mom_cold
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  # ptmp1 worktree build: the only tree carrying the LSQ source; the
  # ptmp2 install is on the stalled NFS gateway.
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 12
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 100
  cpus_per_task: 8
  mem: 30G
  final_requeue_when: wall
  final_requeue_max: 500
  # The existing checkpoint used a different radius grid and radiation solver.
  # Reusing it would mix populations with an incompatible transfer setup.
  warm_restart: false
  vadat_overrides:
    LSTAR: 4.265857D8
    RSTAR: 1.454688D4
    RMAX: 8.61436267
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
    MAX_CF: 2.0D2
    DIF: T
    IB_METH: DIFFUSION
    THK_LINE: T
    STOP_IF_BP: F
    FIX_T: T
    FIX_T_AUTO: F
    DO_T_AUTO: T
    FIX_IMP: F
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    USE_LAM_ES: T
    SOL_METH: DIAG
    DO_NOMONO_KNOP: F
    DO_NONMONO_KNOP: F
    N_OB_INS: '0'
    N_IB_INS: '0'
    REV_RGRID: F
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
    LAM_SET: F
    USE_J_REL: F
    USE_FRM_REL: F
    USE_DJDT_RTE: F
    INC_GRID: F
    N_TYPE: N_ON_J
    PURE_HUB: F
    VEL_LAW: '11'
    RD_IN_R_GRID: T
    FG_OPT: INT/INS
    USE_FIXED_J: F
    PP_MOD: F
    PP_NOV: F
    AUTO_SMOOTH: F
    NON_MONO_SOLVER: T
    DO_NOMONO_SOB: T
    DO_NONMONO_SOB: T
    DO_NONLOC_SOB: F
    GLOBAL_LINE: SOB
    DO_SOB_LINES: T
    SOB_FREQ_IN_OBS: T
    JBAR_W_EDD: T
    DO_NG: T
    NG_ABSTAIN: T
    COMP_BA: T
    NUM_LAM: '2'
    LAM_ENTER: 4.0D2
    LAM_EXIT: 5.0D0
    LAM_N_STABLE: '5'
    BA_PROBE_LAM: '0'
    FRESH_BA_EXIT: T
    N_FULL_TREL: '0'
    DO_BA_RES_ACC: F
    BA_RES_GROW: 1.5D0
    BA_TRUST: 1.0D4
    BA_REJ_FRAC: 0.25D0
    BA_NREJ_LIM: '100'
    BA_ENTER_RAW: 1.0D30
    BA_DAMP_CAP: 0.0D0
    BA_SAT_RAW: 2.0D3
    BA_SAT_LIM: '0'
    BA_DEM_PFLOOR: 1.0D-30
    # Empty-ion rows (CSIX lev 1 ~4.6e-26 at surface) oscillated the
    # demand metric 1e4% for 400+ iterations without blocking physics.
    BA_DEM_RELFRAC: 1.0D-6
    # Keep JFNK off so this run tests the validated Lambda path directly.
    DO_JFNK: F
    JFNK_WARMUP: '6'
    JFNK_FRZ_GATE: 3.0D0
    JFNK_GATE_NREQ: '2'
    JFNK_LAG_FACTORS: T
    JFNK_COR_GATE: 5.0D0
