# dev7 sanity check (18-Sep-2026): monotonic homologous ejecta snapshot
# (M15-He-O-Ca-evo, t=25.10407 d, ND=150) downloaded from
# https://ttt.astro.su.se/~maer0651/M15-He-O-Ca-evo-new-4-all/1/SN_HYDRO_DATA
# placed at cmfgen/25.10days/SN_HYDRO_DATA.
#
# Purpose: verify dev7 (cmfgen_nonmono_dev_V7) runs the standard upstream
# code path end to end — populations + spectrum — with DO_NONMONO_SOB off.
# The model is monotonic (sigma=0 everywhere), so this exercises only the
# flag-off path; it is a stability sanity check, not a non-mono test.
#
# skip_stella + existing SN_HYDRO_DATA => no STELLA job, no conversion.

model_name: M15_HeOCa_25d_DEV7
description: 'dev7 sanity: M15-He-O-Ca-evo homologous snapshot at 25.10 d
  (monotonic, sigma=0). cmfgen_dev.exe from cmfgen_nonmono_dev_V7.
  Populations + spectrum on interactive partition.'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: true
cancel_jobs: true
force_cancel: true
plot_lightcurve: false
submission: debug
hydro_backend: stella

cmfgen_conversion:
  snapshot_days:
  - 25.1
  # SN_HYDRO_DATA is supplied directly (downloaded); skip .swd conversion.
  use_existing_sn_hydro: true

cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 1000
  single_final: true
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: false
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  depth_independent_solver: true
  # DO_GT_AUTO=F: disable grey-T update — model was not converging with it on.
  do_gt_auto: false
  vadat_overrides:
    # Match the original Stockholm model: pure ejecta, no photospheric
    # luminosity (LSTAR=0), turbulent velocity 50 km/s, zero-flux inner BC.
    LSTAR: 0.0D0
    VTURB: 50.0D0
    DIF: F
    IB_METH: ZERO_FLUX
    # Pipeline's static snapshot setup (REL_OBS=F, USE_LAM_ES=T) trips
    # upstream's SN_MODEL consistency check; STOP_IF_BP=F keeps it a
    # warning in OUTGEN. Same setup as the v7_bench run, which completes.
    STOP_IF_BP: F
    # No grid adjustments: SN_HYDRO_DATA arrives pre-optimized
    # (user directive 18-Sep-2026). Also now the pipeline default.
    REV_RGRID: F
    N_OB_INS: 0
    # Hydro electron density is a rough estimate — let CMFGEN solve
    # Ne from charge conservation (user directive 18-Sep-2026).
    # Also now the pipeline default for static snapshots.
    FIX_NE: F
    # Stall fix (18-Sep-2026): FIX_BA=15 + N_FIX_BA=0 froze the Jacobian
    # at ~it250 and the model plateaued at maxchng~0.357 with no escape
    # path (stored-inverse fixed point). N_FIX_BA=10 re-enables the
    # periodic recompute branch (fresh BA at least every ~10 its when
    # MAXCH>VAL_FIX_BA, plus the MAXCH_SUM>3*VAL escape); FIX_BA=1.0
    # delays the freeze until below 1% instead of 15%.
    FIX_BA: 1.0D1
    N_FIX_BA: 2
  mem: 31G
  init_mem: 31G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de

output:
  model_dir: ./dev7_sanity/M15_HeOCa_25d_DEV7
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
