model_name: dessart_m15_2p82d_SOB_jfnk_zflux
description: Fresh zero-flux inner-boundary variant of the m15 SOB run.
  Identical to dessart_m15_2p82d_SOB_jfnk_requeue_fiximpf except
  IB_METH=ZERO_FLUX with DIF=F, replacing the diffusion inner boundary.
  JBAR_W_EDD must be F under DIF=F because the line-section dJ
  linearization reaches PERTJFEAU_IBC, which only has the diffusion
  inner BC installed; DIF=F routes it through NEWPERTJD.
  LSTAR stays at the SN_HYDRO_DATA header value since LSTAR=0 leaves
  the inner boundary dead (m15 diverged from it1, job 12000611).
  RSTAR/RMAX are pinned to the inner-grid values the fiximpf run used
  so the working-tree photospheric-RSTAR default in prepare_VADAT.py
  does not add a second uncontrolled change. The diffusion-boundary
  run is parked in a BA reject/mask limit
  cycle driven by the H II ionization equation at the innermost
  cells (depths 69-70, tau_ross~39).
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_SOB_jfnk_zflux
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
