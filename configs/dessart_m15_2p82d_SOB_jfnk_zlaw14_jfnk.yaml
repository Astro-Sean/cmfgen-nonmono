model_name: dessart_m15_2p82d_SOB_jfnk_zlaw14_jfnk
description: JFNK variant of zlaw14_jfnk. Same blended-coordinate
  Rosseland-tau R grid and guards-off mode controls as zlaw14, but
  DO_JFNK=T admits the frozen-J Newton-Krylov solve on full calls.
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_SOB_jfnk_zlaw14_jfnk
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  install_dir: /viper/ptmp2/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 14
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 1000
  cpus_per_task: 8
  mem: 30G
  final_requeue_when: wall
  final_requeue_max: 500
  # 08-Oct-2026: resume from the RVTJ/POINT checkpoint on resubmit
  # instead of cold-starting.  Needed after the it47 READ_BCD_MAT
  # crash (stored BAMAT without its SCRATCH factor cache).
  warm_restart: true
  vadat_overrides:
    LSTAR: 4.265857D8
    RSTAR: 1.454688D4
    RMAX: 8.61436267
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
    MAX_CF: 2.0D2
    DIF: F
    IB_METH: ZERO_FLUX
    THK_LINE: T
    STOP_IF_BP: F
    FIX_T: T
    FIX_T_AUTO: F
    FIX_IMP: F
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    USE_LAM_ES: T
    SOL_METH: DIAG
    DO_NOMONO_KNOP: F
    DO_NONMONO_KNOP: F
    N_OB_INS: '0'
    N_IB_INS: '0'
    REV_RGRID: F
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
    LAM_SET: F
    USE_J_REL: F
    USE_FRM_REL: F
    USE_DJDT_RTE: F
    INC_GRID: F
    N_TYPE: N_ON_J
    PURE_HUB: F
    VEL_LAW: '14'
    RD_IN_R_GRID: F
    FG_OPT: INT/INS
    USE_FIXED_J: F
    PP_MOD: F
    PP_NOV: F
    AUTO_SMOOTH: F
    NON_MONO_SOLVER: T
    DO_NOMONO_SOB: T
    DO_NONMONO_SOB: T
    DO_NONLOC_SOB: F
    GLOBAL_LINE: SOB
    DO_SOB_LINES: T
    SOB_FREQ_IN_OBS: T
    JBAR_W_EDD: F
    DO_NG: T
    COMP_BA: T
    NUM_LAM: '2'
    LAM_ENTER: 4.0D2
    LAM_EXIT: 2.0D1
    LAM_N_STABLE: '3'
    # 08-Oct-2026: all fork guard layers disabled at user request --
    # restores stock mode switching (MAXCH<50 hands off to full
    # iterations; no resacc rollback, probes, demand gates, demotions).
    BA_PROBE_LAM: '0'
    FRESH_BA_EXIT: T
    N_FULL_TREL: '0'
    DO_BA_RES_ACC: F
    BA_RES_GROW: 1.5D0
    BA_TRUST: 1.0D4
    BA_REJ_FRAC: 0.25D0
    BA_NREJ_LIM: '100'
    BA_ENTER_RAW: 1.0D30
    BA_DAMP_CAP: 0.0D0
    BA_SAT_RAW: 2.0D3
    BA_SAT_LIM: '0'
    # 08-Oct-2026: frozen-tier JFNK (Newton-Krylov on the lagged-J
    # SE residual) replacing the single clipped BA step on full
    # calls.  Coupled tier is unavailable under SOB.  Gates left at
    # 0 (ungated) so the tier fires on every eligible full call;
    # JFNK_PTC/LOGX/LS stay at their T defaults.
    DO_JFNK: T
    JFNK_WARMUP: '6'
    # 08-Oct-2026: admit JFNK only once the demanded MAXCH (%) stays
    # below the gate; gate=0 fired it inside the demand-200..700
    # Lambda recovery transient where frozen-J cannot help.
    JFNK_FRZ_GATE: 1.0D1
    JFNK_COR_GATE: 5.0D0
    JFNK_MAX_EVALS: '200'
    JFNK_MAX_RESTART: '2'
    JFNK_DEEPDIAG: F
    # 08-Oct-2026: keep at 1e-30.  BA rows are population-scaled, so
    # 1e-10 flagged ~68% of every depth block (all trace-ion rows,
    # ~1260/1839 per depth) as null and projected away their Newton
    # updates.  Only structurally-null rows (NaN-zeroed compression
    # rows, exact-zero constraints) belong in JFNK_ROW_REG.
    JFNK_ROW_TINY: 1.0D-30
    # 08-Oct-2026: unconditional per-row LM ridge alpha*|A_ii| now
    # wired (was a dead knob).  Conservative 1e-8 to bound the
    # huge-z directions the unmasked near-singular rows produce.
    JFNK_RIDGE: 1.0D-8
    LAM_VAL: 2.0D2
    BEG_NG: 1.0D1
    IBEG_NG: '15'
    BA_MAXCH_FAIL: 1.0D30
    REL_OBS: F
    REL_CMF: F
    DO_DDT: F
    INC_ADV: F
    INC_AD: F
    INCL_DJDT: F
    CHK_L_POS: T
    LIN_INT: F
    DO_DIS: T
    INC_PEN: T
    INC_CHG: F
    ALLOW_OL: F
    DC_METH: LTE
    T_INIT_TAU: 1.5D0
    SIG_GAU_KMS: 3.0D3
    INC_RAY: T
    MAX_LIN: 5.0D0
    BA_CHK_FAC: 1.0D-05
    EPS_TERM: 5.0D-02
    BW_NG: '40'
    TRANS_HI: SOB
    TRANS_HeI: SOB
    TRANS_He2: SOB
    TRANS_CIII: SOB
    TRANS_CIV: SOB
    TRANS_CV: SOB
    TRANS_NIII: SOB
    TRANS_NIV: SOB
    TRANS_NV: SOB
    TRANS_O2: SOB
    TRANS_OIII: SOB
    TRANS_OIV: SOB
    TRANS_OV: SOB
    TRANS_OSIX: SOB
    TRANS_NeIII: SOB
    TRANS_NeIV: SOB
    TRANS_NeV: SOB
    TRANS_MgIII: SOB
    TRANS_MgIV: SOB
    TRANS_MgV: SOB
    TRANS_AlIII: SOB
    TRANS_AlIV: SOB
    TRANS_AlV: SOB
    TRANS_SkIII: SOB
    TRANS_SkIV: SOB
    TRANS_SkV: SOB
    TRANS_SIII: SOB
    TRANS_SIV: SOB
    TRANS_SV: SOB
    TRANS_ArIII: SOB
    TRANS_ArIV: SOB
    TRANS_ArV: SOB
    TRANS_CaIII: SOB
    TRANS_CaIV: SOB
    TRANS_CaV: SOB
    TRANS_CaSIX: SOB
    TRANS_TkIII: SOB
    TRANS_TkIV: SOB
    TRANS_TkV: SOB
    TRANS_CrIII: SOB
    TRANS_CrIV: SOB
    TRANS_CrV: SOB
    TRANS_CrSIX: SOB
    TRANS_FeIII: SOB
    TRANS_FeIV: SOB
    TRANS_FeV: SOB
    TRANS_FeSIX: SOB
    TRANS_FeSEV: SOB
  cmf_flux_param_overrides:
    DO_CMF_EW: F
    WR_dFR: true
    WR_IP: true
  notification_email: sbrennan@mpe.mpg.de
