model_name: dessart_m15_2p82d_SOB_jfnk_dr
description: Fresh optimized JFNK model - GMRES-DR deflation + LU left-PC + PTC stall policy, cold start. Base = zlaw14_oscfix
  asymmetric decrease cap (MAX_DEC=1e4) and same-cell limit-cycle
  detector (b6df046) live from iteration 1, plus DO_AV=F.
# 24h partition required: a single JFNK-CPL Newton solve (~90 evals x ~50s)
# cannot finish inside interactive's 29-min post-graceful-stop window.
submission: normal
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_SOB_jfnk_dr
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  install_dir: /viper/ptmp2/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 14
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 1000
  cpus_per_task: 8
  mem: 30G
  final_requeue_when: wall
  final_requeue_max: 500
  # Fresh model (09-Oct-2026): cold start, no checkpoint resume.
  warm_restart: false
  vadat_overrides:
    LSTAR: 4.265857D8
    RSTAR: 1.454688D4
    RMAX: 8.61436267
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
    MAX_CF: 2.0D2
    DIF: F
    IB_METH: ZERO_FLUX
    THK_LINE: T
    STOP_IF_BP: F
    FIX_T: T
    FIX_T_AUTO: F
    FIX_IMP: F
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    USE_LAM_ES: T
    SOL_METH: DIAG
    DO_NOMONO_KNOP: F
    DO_NONMONO_KNOP: F
    N_OB_INS: '0'
    N_IB_INS: '0'
    REV_RGRID: F
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
    LAM_SET: F
    USE_J_REL: F
    USE_FRM_REL: F
    USE_DJDT_RTE: F
    INC_GRID: F
    N_TYPE: N_ON_J
    PURE_HUB: F
    VEL_LAW: '14'
    RD_IN_R_GRID: F
    FG_OPT: INT/INS
    USE_FIXED_J: F
    PP_MOD: F
    PP_NOV: F
    AUTO_SMOOTH: F
    NON_MONO_SOLVER: T
    DO_NOMONO_SOB: T
    DO_NONMONO_SOB: T
    DO_NONLOC_SOB: F
    GLOBAL_LINE: SOB
    DO_SOB_LINES: T
    SOB_FREQ_IN_OBS: T
    JBAR_W_EDD: F
    DO_NG: T
    COMP_BA: T
    NUM_LAM: '2'
    LAM_ENTER: 4.0D2
    LAM_EXIT: 5.0D0
    LAM_N_STABLE: '5'
    # 08-Oct-2026: all fork guard layers disabled at user request --
    # restores stock mode switching (MAXCH<50 hands off to full
    # iterations; no resacc rollback, probes, demand gates, demotions).
    BA_PROBE_LAM: '0'
    FRESH_BA_EXIT: T
    N_FULL_TREL: '0'
    DO_BA_RES_ACC: F
    BA_RES_GROW: 1.5D0
    BA_TRUST: 1.0D4
    BA_REJ_FRAC: 0.25D0
    BA_NREJ_LIM: '100'
    BA_ENTER_RAW: 1.0D30
    BA_DAMP_CAP: 0.0D0
    BA_SAT_RAW: 2.0D3
    BA_SAT_LIM: '0'
    # 09-Oct-2026: coupled-tier test (JFNK_SOB_LINE_PASS_V1).  Every
    # post-warmup call runs the coupled SE+RTE Newton eval -- the
    # residual re-solves J (FG_J_CMF_V13) AND the Sobolev line rates
    # (SUB_SOB_LINE_V3) at the trial pops, so the FD-JVP sees dJ/dn.
    # ANYITER=T + COR_GATE=0 means JFNK is attempted on every call
    # (LAMBDA-designated included); the only scheduled-BA path left is
    # JFNK's own internal LAMBDA fallback.  That is the requested
    # Lambda+JFNK-only configuration.
    DO_JFNK: T
    JFNK_COUPLED: T
    JFNK_ANYITER: T
    JFNK_WARMUP: '6'
    JFNK_FRZ_GATE: 0.0D0
    # 09-Oct-2026 (optimized): admit coupled Newton only once the raw
    # demanded correction is below 100%.  The GMRES stall audit showed
    # the residual is field-mode dominated while demand runs ~1e2-1e6;
    # Lambda contractions are the progress mechanism there, and every
    # coupled admission burned ~30-60 min of evals for a strike.
    JFNK_COR_GATE: 1.0D2
    # Coupled evals cost a full radiation sweep (~40-60 s each), so
    # the eval budget is capped at 60 rather than 200 -- enough for
    # baseline + ~2 GMRES restart cycles per Newton step while keeping
    # a stalled admission under ~1 wallclock hour.
    # 90 covers a DR refresh (up to 12 JVPs) plus ~2.5 restart
    # cycles per Newton step.
    JFNK_MAX_EVALS: '90'
    JFNK_MAX_RESTART: '2'
    JFNK_DEEPDIAG: F
    # 08-Oct-2026: keep at 1e-30.  BA rows are population-scaled, so
    # 1e-10 flagged ~68% of every depth block (all trace-ion rows,
    # ~1260/1839 per depth) as null and projected away their Newton
    # updates.  Only structurally-null rows (NaN-zeroed compression
    # rows, exact-zero constraints) belong in JFNK_ROW_REG.
    JFNK_ROW_TINY: 1.0D-30
    # 08-Oct-2026: unconditional per-row LM ridge alpha*|A_ii| now
    # wired (was a dead knob).  Conservative 1e-8 to bound the
    # huge-z directions the unmasked near-singular rows produce.
    JFNK_RIDGE: 1.0D-8
    # 09-Oct-2026: m=10 GMRES produced anti-descent directions
    # (<F,Js><0) on the outer-depth H residual block -- the Krylov
    # space saturates before restart.  m=30 with a 90-iter cap per
    # Newton step gives the minimization room for a physical descent
    # direction while staying inside the 200-eval budget.
    JFNK_M: '30'
    JFNK_MAXGMRES: '90'
    # 09-Oct-2026 (optimized): LU(BA) under left-PC.  Under left-PC
    # the preconditioned operator M^-1 J has its fast spectrum at ~1
    # (LU inverts the local block) plus the small field-mode
    # eigenvalues the local operator cannot see -- exactly the
    # spectrum GMRES-DR deflates.  Right-PC showed 100% directional
    # mismatch vs the FD JVP on this model.
    JFNK_LEFTPC: T
    JFNK_PRECOND: LU
    # GMRES-DR (Morgan 2002 thick restart): recycle 12 harmonic-Ritz
    # vectors across restarts and across Newton solves.  Numerically
    # verified on a separated-spectrum test: residual 1.8e-5 vs 7e-3
    # plain at 60 JVPs.  KEEP=T costs ~12 refresh JVPs per solve
    # entry so the field modes survive between Newton steps.
    JFNK_DR_K: '12'
    JFNK_DR_KEEP: T
    # FD-JVP step for the iterative coupled eval (Kelley h ~
    # sqrt(dF/F); code guidance 1e-3..1e-2).  Machine-eps steps on an
    # iteratively-solved residual inject noise into the Krylov basis.
    JFNK_EPS: 1.0D-2
    LAM_VAL: 2.0D2
    BEG_NG: 1.0D1
    IBEG_NG: '15'
    BA_MAXCH_FAIL: 1.0D30
    REL_OBS: F
    REL_CMF: F
    DO_DDT: F
    INC_ADV: F
    INC_AD: F
    INCL_DJDT: F
    CHK_L_POS: T
    LIN_INT: F
    DO_DIS: T
    INC_PEN: T
    INC_CHG: F
    ALLOW_OL: F
    DC_METH: LTE
    T_INIT_TAU: 1.5D0
    SIG_GAU_KMS: 3.0D3
    INC_RAY: T
    MAX_LIN: 5.0D0
    # Asymmetric cap: decreases may step by up to a factor 1e4 per
    # non-LAMBDA solve (increases stay at MAX_LIN).  Breaks the
    # CV:1s_2p_1Po depth-10 limit cycle where a drain-pinned level
    # demanded ~1e5x every FULL solve but the symmetric cap only
    # allowed 5x, so the cell could never reach its asymptote.
    MAX_DEC: 1.0D4
    DO_AV: F
    DO_AA: T
    AA_M: '5'
    BA_CHK_FAC: 1.0D-05
    EPS_TERM: 5.0D-02
    BW_NG: '40'
    TRANS_HI: SOB
    TRANS_HeI: SOB
    TRANS_He2: SOB
    TRANS_CIII: SOB
    TRANS_CIV: SOB
    TRANS_CV: SOB
    TRANS_NIII: SOB
    TRANS_NIV: SOB
    TRANS_NV: SOB
    TRANS_O2: SOB
    TRANS_OIII: SOB
    TRANS_OIV: SOB
    TRANS_OV: SOB
    TRANS_OSIX: SOB
    TRANS_NeIII: SOB
    TRANS_NeIV: SOB
    TRANS_NeV: SOB
    TRANS_MgIII: SOB
    TRANS_MgIV: SOB
    TRANS_MgV: SOB
    TRANS_AlIII: SOB
    TRANS_AlIV: SOB
    TRANS_AlV: SOB
    TRANS_SkIII: SOB
    TRANS_SkIV: SOB
    TRANS_SkV: SOB
    TRANS_SIII: SOB
    TRANS_SIV: SOB
    TRANS_SV: SOB
    TRANS_ArIII: SOB
    TRANS_ArIV: SOB
    TRANS_ArV: SOB
    TRANS_CaIII: SOB
    TRANS_CaIV: SOB
    TRANS_CaV: SOB
    TRANS_CaSIX: SOB
    TRANS_TkIII: SOB
    TRANS_TkIV: SOB
    TRANS_TkV: SOB
    TRANS_CrIII: SOB
    TRANS_CrIV: SOB
    TRANS_CrV: SOB
    TRANS_CrSIX: SOB
    TRANS_FeIII: SOB
    TRANS_FeIV: SOB
    TRANS_FeV: SOB
    TRANS_FeSIX: SOB
    TRANS_FeSEV: SOB
  cmf_flux_param_overrides:
    DO_CMF_EW: F
    WR_dFR: true
    WR_IP: true
