model_name: dessart_m15_2p82d_SOB_jfnk_dif2
description: "Warm-restart probe - continue the alo_probe it514
  checkpoint with Luc's inner-boundary physics (DIF=T,
  IB_METH=DIFFUSION, JBAR_W_EDD=T).  ZERO_FLUX starves the photosphere
  at inner tau_es~37; the repo docs prescribe DIFFUSION for m15 SOB.
  Tests whether the population state re-equilibrates toward Luc's
  spectrum.  Not a production run."
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_SOB_jfnk_dif2_probe
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  # 12-Oct-2026: OBS-only resubmit. The FINAL job was cancelled manually
  # after writing RVTJ/POP*/checkpoint; SKIP_FINAL submits the spectrum
  # job alone. Remove when the FINAL job next needs to run.
  skip_final: false
  target_nd: 70
  # ptmp1 worktree build: the only tree carrying the LSQ source; the
  # ptmp2 install is on the stalled NFS gateway.
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 14
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 100
  cpus_per_task: 8
  mem: 30G
  # 12-Oct-2026: 'sob' = resolved Sobolev render via profile injection
  # (DO_SOB_FLUX_OBS=T): GLOBAL_LINE/TRANS_*=SOB mirrored from VADAT,
  # DO_SOB_LINES=T computes each line's SIGMA_TRUE opacity/emissivity,
  # ADD_SOB_LINE_PROF writes them into the stored CMF arrays as Doppler
  # cores, SOB_FREQ_IN_OBS=T refines the observed grid across each
  # resonance zone, and a second OBS_FRAME_SUB_V9 pass renders the
  # resolved profiles into OBSFRAME.  This is the only render
  # consistent with the SOB populations: CMF/BLANK line transfer
  # over-emits ~10x on the non-monotonic field.  'sob_ew'
  # keeps the EW diagnostic (deposition off, continuum-only spectrum);
  # 'blank' is the full CMF profile render used for KNOP runs and .fl
  # comparison.  Non-mono hardening still applies: DO_NONMONO_KNOP=T,
  # NON_MONO_SOLVER=T, N_ON_J, FG_OPT=INT/INS.
  # 12-Oct-2026 control result: 'blank' render on the same checkpoint
  # (job 12166771) peaks at 1.6e7 Jy -- the 1e18 Jy spikes in the first
  # profile-injection render were an injection artifact (total CHI
  # floored to 1e-30 at masering cells), fixed by dropping maser cells
  # in ADD_SOB_LINE_PROF (cmfgen_jfnk commit 2db3338).
  obs_line_treatment: sob
  # Resolved-SOB render is much lighter than the blank render (no
  # per-line profile storage for SOB lines); 30G is comfortable.
  # general over interactive: the interactive AssocMaxJobsLimit is
  # saturated by the SOB/KNOP probe fleet (12-Oct-2026).
  obs_partition: general
  obs_mem: 30G
  final_requeue_when: wall
  final_requeue_max: 500
  # Same warm-restart checkpoint as the JFNK probes: POINT1/POINT2/
  # SCRTEMP plus RVTJ/MODEL/CUR_MODEL_DATA injected into the fresh dir.
  warm_restart: true
  warm_restart_from: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_validation/m15_2p82d_SOB_jfnk_dif_probe/cmfgen/2.82days
  vadat_overrides:
    LSTAR: 4.265857D8
    RSTAR: 1.454688D4
    RMAX: 8.61436267
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
