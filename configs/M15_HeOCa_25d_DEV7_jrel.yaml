# dev7 companion to the dev6 JREL test (18-Sep-2026): identical inputs,
# dev7 cmfgen_dev.exe. Same monotonic homologous ejecta snapshot
# (M15-He-O-Ca-evo, t=25.10407 d, ND=150).
#
# Purpose: A/B against dev6 - same tridiagonal relativistic moment
#   USE_LAM_ES=F + USE_J_REL=T + REL_OBS=T + REL_CMF=T -> MOM_JREL_V9
#   SOL_METH=TRIDIAG + NUM_BNDS=3 -> real tridiagonal coupling
# with the corrected VADAT parameters (IT_ON_T=F, FIX_NE=F, DO_GT_AUTO=F).
# This exercises the banded solver with genuine off-diagonal coupling
# (the earlier TRIDIAG run had zero off-diagonals under USE_LAM_ES=T).

model_name: M15_HeOCa_25d_DEV7_JREL
description: 'dev7 JREL test: M15-He-O-Ca-evo snapshot at 25.10 d, dev7
  cmfgen_dev.exe, corrected VADAT params, USE_LAM_ES=F + USE_J_REL=T +
  TRIDIAG banded solver).'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: true
cancel_jobs: true
force_cancel: true
plot_lightcurve: false
submission: debug
hydro_backend: stella

cmfgen_conversion:
  snapshot_days:
  - 25.1
  use_existing_sn_hydro: true

cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 1000
  single_final: true
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: false
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  depth_independent_solver: false
  do_gt_auto: false
  vadat_overrides:
    LSTAR: 0.0D0
    VTURB: 50.0D0
    DIF: F
    IB_METH: ZERO_FLUX
    STOP_IF_BP: F
    REV_RGRID: F
    N_OB_INS: 0
    FIX_NE: F
    # J path: relativistic moment solver with real
    # tridiagonal coupling (VAR_JREL_V5 fills TX/TVX).
    USE_LAM_ES: F
    USE_J_REL: T
    REL_OBS: T
    REL_CMF: T
    # Inert in dev7 (it ignores DO_NOMO_*), set F for parity with the
    # dev6 A/B run and to prevent stale-key leaks.
    DO_NOMONO_KNOP: F
    DO_NOMONO_SOB: F
    DO_NONMONO_SOB: F
    NON_MONO_SOLVER: F
  mem: 31G
  init_mem: 31G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de

output:
  model_dir: ./dev7_sanity/M15_HeOCa_25d_DEV7_JREL
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
