# Point-source irradiated SN A ejecta at 350 days.
#
# SN_HYDRO_DATA is staged by scripts/age_sn_hydro_data.py from the 50.2 d
# SN_A_g_T20k_Ni06 conversion: homologous (ballistic) expansion to 350 d,
# velocity monotonised at the reversal near 3950 km/s, Ni56 -> Co56 -> Fe56
# decayed analytically from the .xni initial Ni56 profile.  An artificial
# 7000 K blackbody point source (L = 1e42 erg/s = 2.61e8 Lsun,
# R_PNT = 1.098e4 Rsun = 7.6e14 cm, well inside the 6.8e15 cm cavity)
# heats the old ejecta; FIX_T=F lets the gas temperature respond.
#
# DO_NONMONO_SOB mode (GLOBAL_LINE=SOB, Dessart+2015 recipe): the
# verified pairing is USE_LAM_ES=T with SOL_METH=DIAG, so TRI is
# superseded under this solver mode.  Cold start is LTE (LTE_EST=T,
# T_EXC required) - no proxy _IN files.
model_name: point_source_sn_a
description: 'SN_A_g_T20k_Ni06 ejecta aged homologously 50.2d -> 350d,
  irradiated by a 7000 K / 1e42 erg/s inner point source (IB_METH=PNT_SRCE).
  DO_NONMONO_SOB Sobolev mode, LTE_EST=T cold start, T solved
  (FIX_T=F, FIX_T_AUTO=T).'
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: ./point_source_sn_a
  cmfgen_output: cmfgen
  plots: plots
  outputs: output
cmfgen_conversion:
  snapshot_days:
    - 350.0
  use_existing_sn_hydro: true
cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  single_final: true
  target_nd: 140
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_jfnk
  proxy_populations: false
  inc_rad_decays: true
  vturb: 20.0
  incl_rel: false
  vel_law: 11
  # DO_NONMONO_SOB: Sobolev line treatment (GLOBAL_LINE=SOB), verified
  # pairing USE_LAM_ES=T / SOL_METH=DIAG (TRI is incompatible with the
  # SOB solver path - depth_independent_solver=true keeps them synced).
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  # Opt-in: release the FIX_T/FIX_T_AUTO hydro-T pin so the gas
  # temperature responds to the artificial inner source heating.
  solve_temperature: true
  # Point-source luminosity stamped into LSTAR (RLUMST normalisation and
  # the luminosity guard; the injected flux itself is R_PNT*TEFF_PNT).
  inner_boundary_luminosity_lsun: 2.61e8
  partition: general
  cpus_per_task: 8
  mem: 64G
  init_mem: 64G
  init_num_its: 1000
  n_ob_ins: 0
  vadat_overrides:
    DIF: F
    IB_METH: PNT_SRCE
    PNT_SRCE: T
    R_PNT: 1.098D4
    TEFF_PNT: 0.70D0
    LSTAR: 2.61D8
    FIX_T: F
    FIX_T_AUTO: T
    # rd_control_variables.f makes JFNK_TAUTO a required key when
    # FIX_T_AUTO=T (default = VARFIXT).  Inert here (DO_JFNK off).
    JFNK_TAUTO: T
    FIX_NE: F
    FIX_IMP: T
    USE_LAM_ES: T
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    SOL_METH: DIAG
    GLOBAL_LINE: SOB
    DO_NONMONO_SOB: T
    DO_NOMONO_SOB: T
    LTE_EST: T
    T_EXC: 0.3D0
    N_OB_INS: '0'
    N_IB_INS: '0'
    REV_RGRID: F
    THK_CONT: F
    IB_STAB: 0.1D0
    VTURB: 20.0D0
    STOP_IF_BP: F
    T_ON_R: T
    SCL_SL_OPAC: T
    SCL_LN: F
    INC_GRID: F
    ALL_FREQ: F
    AUTO_SMOOTH: F
    COMP_BA: T
    DO_NG: F
    MIN_CF: 3.0D-3
    T_INIT_TAU: 1.5D0
    MAX_LAM: 1.0D10
    MAX_LIN: 5.0D0
    LAM_VAL: 2.0D2
    NUM_LAM: '2'
    # Required keys newer than cmfgen_base/VADAT_INIT (values match the
    # verified m15_2p82d_KNOP_FORMAL_freqmatch run).
    LAM_ENTER: 4.0D2
    LAM_EXIT: 5.0D0
    LAM_N_STABLE: '5'
    FRESH_BA_EXIT: T
    N_FULL_TREL: '0'
    T_REL_CHG: 3.0D0
    N_FIX_BA: '2'
    FIX_BA: 1.0D1
    BA_CHK_FAC: 1.0D-05
    BEG_NG: 1.0D1
    IBEG_NG: '15'
    BW_NG: '40'
    ITS/NG: '8'
    EPS_TERM: 5.0D-02
    IT_ON_T: T
    VFRAC_MOM: 5.0D0
    VFRAC_FG: 1.0D0
    LAM_SCALE_OPT: NONE
  notification_email: sbrennan@mpe.mpg.de
