# Interior negJ diagnostics run (24-Sep-2026).  Identical physics to
# M15_HeOCa_25d_DEV7_knop_MOM_bndflrF.yaml (full 18-species
# MODEL_SPEC via cmfgen_base_fullspec, NCF=23723); fresh dir.
#
# Purpose: capture the new TB,TA,TC,absorp,COH,DTAUONQ record line at
# the persistent interior negJ cells (depths ~408-412 of ND_NM=448,
# sigma~0) to confirm whether the tridiagonal diagonal goes negative
# via (1-COH)*DTAUONQ when ESEC/CHI > 1.  Diagnostics-only change;
# physics identical to bndflrF.
#
# Binary: cmfgen_nonmono_dev_V7 exe/cmfgen_dev.exe built 24-Sep-2026
# 14:37, HEAD = d0eb12f (= 6723811 negJ row diagnostics + 41083d9 /
# d0eb12f knop ray-coefficient hoists, physics-neutral refactors).
#
model_name: M15_HeOCa_25d_DEV7_knop_MOM_negdiag
description: 'negJ row-coefficient diagnostics: identical atomic model
  to bndflrF (full 18-species, NCF=23723) + the diagnostic binary
  (HEAD d0eb12f); fresh dir.  Prints TB/TA/TC/absorp/COH/DTAUONQ at
  each negative-J record to confirm the ESEC>CHI diagonal defect.'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: true
cancel_jobs: true
force_cancel: true
plot_lightcurve: false
submission: debug
hydro_backend: stella

cmfgen_conversion:
  snapshot_days:
  - 25.1
  use_existing_sn_hydro: true

cmfgen:
  base_dir: ./cmfgen_base_fullspec
  model_type: static_snapshot
  init_num_its: 1000
  single_final: true
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: false
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  depth_independent_solver: true
  do_gt_auto: false
  non_mono_mode: KNOP
  vadat_overrides:
    DO_NONMONO_KNOP: T
    USE_LAM_ES: F
    LSTAR: 0.0D0
    VTURB: 50.0D0
    DIF: F
    IB_METH: ZERO_FLUX
    STOP_IF_BP: F
    REV_RGRID: F
    N_OB_INS: 0
    FIX_NE: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
  mem: 31G
  init_mem: 31G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de

output:
  model_dir: ./dev7_knop_MOM_bndflrF/M15_HeOCa_25d_DEV7_knop_MOM_negdiag
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
