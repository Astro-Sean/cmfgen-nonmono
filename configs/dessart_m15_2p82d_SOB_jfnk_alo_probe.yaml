    DO_LAM_IT: T
    DO_LAM_AUTO: T
    # The test variable: FG_J_CMF_V13 diagonal ALO feeding the
    # continuum Jacobian on the default J=TC Lambda path.
    USE_LAM_ES: T
    DO_FG13_ALO: T
    SOL_METH: DIAG
