model_name: dessart_m15_2p82d_SOB_jfnk_alo_probe
description: Controlled endgame test for the m15 2.82d SOB plateau.
  Warm restarts from m15_2p82d_SOB_jfnk_zlaw14_fresh/probe_snap on the
  DEFAULT USE_LAM_ES=T path plus the opt-in FG_J_CMF_V13 diagonal ALO
  (DO_FG13_ALO=T, 12-Oct-2026); do_var_cont fills the continuum
  dJ/dCHI, dJ/dETA diagonals from the formal solve's own OAB
  approximate-Lambda operator, replacing the pure-Lambda continuum
  update.  The plateau at depths 65-70 contracts at ~0.9986/iteration
  under LAM_ES (broad Lambda-limited mode, ~850/1839 levels demand
  >1%); this probe measures whether the ALO diagonal contracts it
  faster, as a cheaper alternative to the failed USE_LAM_ES=F moment
  route (MOM_J_CMF_V11 diverged at the bluest frequency, jobs
  12158938/12159013).  DO_JFNK=F for a clean measurement.  Sobolev
  line physics (SIGMA_TRUE) unchanged.  Not a production run.
# debug -> interactive partition (1:59 per segment): fast queue
# turnaround for the probe; the COMP_F warm-restart fix keeps
# requeue restarts warm enough not to contaminate the contraction
# measurement.
submission: debug
hydro_backend: stella
skip_stella: true
run_cmfgen: true
run_sedona: false
run_sirocco: false
run_superlite: false
output:
  model_dir: cmfgen_validation/m15_2p82d_SOB_jfnk_alo_probe
cmfgen_conversion:
  snapshot_days:
    - 2.82
  use_existing_sn_hydro: true
cmfgen:
  base_dir: cmfgen_base_dessart
  model_type: static_snapshot
  single_final: true
  target_nd: 70
  # ptmp1 worktree build: the only tree carrying the LSQ source; the
  # ptmp2 install is on the stalled NFS gateway.
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_jfnk
  inc_rad_decays: true
  vturb: 50.0
  incl_rel: false
  vel_law: 14
  non_mono_mode: SOB
  use_lam_es: true
  depth_independent_solver: true
  proxy_populations: false
  init_num_its: 100
  cpus_per_task: 8
  mem: 30G
  final_requeue_when: wall
  final_requeue_max: 500
  # Same warm-restart checkpoint as the JFNK probes: POINT1/POINT2/
  # SCRTEMP plus RVTJ/MODEL/CUR_MODEL_DATA injected into the fresh dir.
  warm_restart: true
  warm_restart_from: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_validation/m15_2p82d_SOB_jfnk_zlaw14_fresh/probe_snap
  vadat_overrides:
    LSTAR: 4.265857D8
    RSTAR: 1.454688D4
    RMAX: 8.61436267
    VTURB: 50.0D0
    MIN_CF: 3.0D-3
    MAX_CF: 2.0D2
    DIF: F
    IB_METH: ZERO_FLUX
    THK_LINE: T
    STOP_IF_BP: F
