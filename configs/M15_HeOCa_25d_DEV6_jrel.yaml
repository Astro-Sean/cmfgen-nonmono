# dev6 test (18-Sep-2026): same monotonic homologous ejecta snapshot
# (M15-He-O-Ca-evo, t=25.10407 d, ND=150) as the dev7 sanity run, but using
# the cmfgen_dev.exe binary from cmfgen_nonmono_dev_V6.
#
# Purpose: test whether dev6 handles USE_LAM_ES=F with the corrected
# VADAT parameters (IT_ON_T=F, FIX_NE=F, DO_GT_AUTO=F). Previous dev6
# failures are suspected to trace to IT_ON_T=T grey-T collapse, not the
# solver itself.
#
# Solver stack (this combination converged in ~40 its in the m15 run):
#   USE_LAM_ES=F + USE_J_REL=T + REL_OBS=T + REL_CMF=T -> MOM_JREL_V9
#   SOL_METH=TRIDIAG + NUM_BNDS=3 -> real tridiagonal coupling
# DO_NOMONO_*=F forces dev6 onto its STANDARD solver stack (identical to
# upstream) rather than the unstable nonmono path.

model_name: M15_HeOCa_25d_DEV6_JREL
description: 'dev6 A/B test: M15-He-O-Ca-evo snapshot at 25.10 d, dev6
  cmfgen_dev.exe, corrected VADAT params, USE_LAM_ES=F + USE_J_REL=T +
  TRIDIAG banded solver, nonmono stack disabled.'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
skip_stella: true
cancel_jobs: true
force_cancel: true
plot_lightcurve: false
submission: debug
hydro_backend: stella

cmfgen_conversion:
  snapshot_days:
  - 25.1
  use_existing_sn_hydro: true

cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 1000
  single_final: true
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V6
  inc_rad_decays: false
  vturb: 50.0
  incl_rel: false
  vel_law: 11
  depth_independent_solver: false
  do_gt_auto: false
  vadat_overrides:
    LSTAR: 0.0D0
    VTURB: 50.0D0
    DIF: F
    IB_METH: ZERO_FLUX
    STOP_IF_BP: F
    REV_RGRID: F
    N_OB_INS: 0
    FIX_NE: F
    # J path: relativistic moment solver with real
    # tridiagonal coupling (VAR_JREL_V5 fills TX/TVX).
    USE_LAM_ES: F
    USE_J_REL: T
    REL_OBS: T
    REL_CMF: T
    # Keep dev6 on the standard upstream solver stack — DO_NOMONO_KNOP=T
    # would activate SOLVE_FOR_POPS_NONMONO_V1 and the unstable nonmono
    # machinery this test is designed to isolate from.
    DO_NOMONO_KNOP: F
    DO_NOMONO_SOB: F
    DO_NONMONO_SOB: F
    NON_MONO_SOLVER: F
  mem: 31G
  init_mem: 31G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
  notification_email: sbrennan@mpe.mpg.de

output:
  model_dir: ./dev6_sanity/M15_HeOCa_25d_DEV6_JREL
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
