# SN 1994W dense-CSM benchmark — isolated Type IIn hydro test
# Goal: reproduce the morphology of Dessart+ (2009, MNRAS 394, 21) day-49.5
# "cool model" (1994-09-01) using a STELLA hydro shell + dense CSM wind.
#
# This is NOT the SN 2024pba two-event setup. It is a controlled test of the
# claim that a genuinely thick, slow, optically-thick CSM photosphere produces
# narrow line cores + broad electron-scattering wings (canonical IIn) rather
# than broad Doppler components.
#
# Structure (x_model_from_sn, no_ejecta):
#   inner: fast H-rich ejecta shell (8 Msun, 4000 km/s)  -> drives interaction
#   outer: dense slow CSM wind (Mdot=0.3, v=800) out to 7e15 cm -> thick photosphere
# Photosphere lands ~3-4e15 in unshocked slow wind -> narrow cores + es wings.
#
# Reference spectrum: e1_v2_s2_7_Bs3_numes40_vt10.fl (Luc Dessart, day 49.5)
#   Luc's model is PARAMETERIZED (rho~r^-10, V~830, T_phot~7500, L~4.7e9);
#   this is a hydro morphology benchmark, not an exact-structure match.

model_name: "SN94W_IIn"
description: "SN1994W dense-CSM IIn benchmark (day49.5). H-rich ejecta shell (8Msun,4000km/s) + dense CSM wind (Mdot0.3,v800) to 7e15. STELLA hydro -> CMFGEN spectrum vs Dessart+2009 e1_v2_s2_7."

run_cmfgen: True
run_sirocco: False
run_sedona: False
run_superlite: False

reuse_stella: False
restart_stella: False

# ── Shell + dense-CSM wind (no old ejecta) ───────────────────────────────────
x_model_from_sn:
  no_ejecta: True                 # Type IIn: H/He shell + CSM wind, no SN_A ejecta
  source_age_days: 10.0           # unused for wind extent (r_outer set explicitly)
  shell_mass_msun: 8.0            # ejecta shell mass (drives the interaction)
  shell_velocity_kms: 4000        # ejecta shell velocity
  shell_composition: "solar"      # H-rich w/ metals (supergiant CSM ~ solar)
  n_rho: 8.0                      # Dessart 2010jl power-law shell structure
  v0_kms: 3000.0                  # core/envelope transition velocity
  n_T: 0.4                        # temperature power-law
  T_interface_K: 2000.0           # shell T at outer edge
  T_max_K: 65000.0                # max shell T in core
  t_start_days: 2.0               # shell pre-expansion before STELLA start
  # Dense CSM wind: Mdot=0.3 Msun/yr, v=800 km/s, out to 7e15 cm.
  # tau_es(phot)~1 near ~3.5e15 -> thick slow photosphere; ~0.7 Msun CSM.
  wind_mdot_msun_yr: 3.0e-1
  wind_velocity_kms: 800
  wind_T_K: 5000
  wind_r_outer_cm: 7.0e15
  no_wind: False
  se_transition_dex: 0.5
  explosion_energy: 0.0           # velocity-driven shell; EKO=0 preserves .hyd v
  aq: 10.0                        # high AQ for non-monotonic velocity
  fit_tau: 5.0
  meth: 3                         # GEAR+BGH
  temp_floor: 0.03
  floor_rad: 0.01
  hmin: 1.0e-14
  hmax: 3600.0

# Ejecta params unused in no_ejecta mode (required by schema)
ejecta:
  M_ejecta_A: 0.0
  R_star_cm: 0.0
  n_shell: 0.0
  V_ejecta_A_initial_kms: 0.0

hydro_backend: stella
stella:
  convection: False
  target_days: 55.0
  nzon: 500
  kappa: 0.34
  snapshot_interval: 1.0
  iout: 10
  r_min: 0.0
  rho_min: 0.0
  stella_root: "/ptmp/sbrennan/stella/OpenStella"
  partition: "general"
  memory: "16G"
  time: "23:59:00"
  outer_fraction: 0.3
  transition_radius: 1e13
  explosion_energy: 0.0
  explosion_mass: 0.0
  explosion_time: 1.0
  explosion_delay: 0.0
  initial_kinetic_energy: 0.0     # EKO=0: preserve .hyd velocity field
  nstmax: 2000000
  eps: 0.003
  hmax: 3600.0
  hmin: 1.0e-14
  meth: 3
  aq: 10.0
  bq: 1.0
  fit_tau: 5.0
  tau_tol: 1.3
  disable_scattering: False
  stella_tau_min: 1e-4
  wacc_r: 1.0
  wacc_v: 1.0
  wacc_t: 0.5
  wacc_rad: 0.5
  temp_floor: 0.03
  floor_rad: 0.01
  use_ronfict: true
  nickel56:
    enabled: False                # interaction-powered; no Ni56 decay

# Temperature profile (unused for x_model mode)
temperature:
  temp_profile_type: "adiabatic"
  N_T_ejecta: 0.6
  T_inner_max: 100000
  T_csm: 5000

# CMFGEN conversion: snapshot at ~day 49.5 (Luc's cool-model epoch)
cmfgen_conversion:
  heracles_dir: "heracles"
  snapshot_days: [49.5]
  epoch_tolerance: 2.0
  stella_extra_days: 0
  output_file: "cmfgen/SN_HYDRO_DATA"
  cmfgen_tau_max: 30
  cmfgen_tau_min: 0.01
  n_grid: 100
  adaptive_grid: true
  gradient_threshold: 0.5
  velocity_max_kms: 10000
  opacity_model: "stella_nlte"
  kappa_constant: 0.34
  enable_grid_thinning: true
  grid_thinning_threshold: 0.005
  enable_adaptive_grid: true
  base_grid_target: 80
  max_points: 150
  min_points: 50
  min_nd: 150
  max_radius_jump: 0.05
  max_temp_jump: 0.10
  max_density_jump: 0.15
  smooth_velocity: false
  no_velocity_smoothing: true
  smooth_wiggles: true
  wiggle_window: 5
  velocity_smooth_window_kms: 50.0
  enable_velocity_spacing_optimization: false
  include_ne_amr: false
  max_ne_jump: 0.10
  max_logtau_jump: 0.25
  max_velocity_jump: 0.30
  max_sigma_jump: 0.5
  max_cell_ratio: 1.5
  thin_grid_tau: 1.0
  thin_grid_priority: 4.0
  outer_boundary_extra_points: 5
  outer_boundary_ratio: 1.5
  min_dr_r: 1.0e-6
  max_dr_r: 0.15
  sigma_priority_threshold: 1.0
  sigma_priority: 10.0
  dsigma_priority_threshold: 0.3
  dsigma_priority: 10.0
  smooth_sigma: false
  max_dsigma: 1.0
  sigma_smooth_passes: 10
  sigma_smooth_window: 0.3

# CMFGEN run — standard solver baseline (DO_NONMONO_KNOP=F), VEL_LAW=11 for the
# non-monotonic velocity field (reads R from RDINR, interpolates V from
# SN_HYDRO_DATA). Same solver class as TypeIIn_10d_DEV7_STD.
cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 200
  single_final: true
  target_nd: 150
  install_dir: /viper/ptmp1/sbrennan/SN2024pba/cmfgen_nonmono_dev_V7
  inc_rad_decays: true
  vturb: 20.0
  incl_rel: false
  vel_law: 11                     # SET_RV_HYDRO_MODEL_V3: V from SN_HYDRO_DATA
  depth_independent_solver: true  # handles velocity reversals
  do_gt_auto: false
  proxy_populations: true
  vadat_overrides:
    LSTAR: 0.0D0
    VTURB: 20.0D0
    # Dense ejecta inner boundary -> thick (tau_inner >> 50): DIFFUSION BC valid.
    DIF: T
    STOP_IF_BP: F
    FIX_T: T                      # hold hydro T structure (shock heating)
    FIX_T_AUTO: F
    FIX_IMP: T
    DO_LAM_IT: T
    DO_LAM_AUTO: T
    N_OB_INS: 0
    N_IB_INS: 0
    REV_RGRID: F
    FIX_BA: 1.0D1
    N_FIX_BA: 2
  mem: 31G
  init_mem: 31G
  n_ob_ins: 0
  final_requeue_when: wall
  final_requeue_max: 500
  partition: "small"
  time: "12:00:00"
  init_partition: "interactive"
  init_time: "01:59:00"
  auto_set_rstar: False
  auto_set_lstar: False
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: "RMAX"

# Output directories
output:
  model_dir: "./SN94W_IIn"
  stella_output: "stella"
  cmfgen_output: "cmfgen"
  sedona_output: "sedona"
  superlite_output: "superlite"
  plots: "plots"
  outputs: "output"
