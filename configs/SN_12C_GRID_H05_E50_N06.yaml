# SN_12C_GRID_H05_E50_N06 - grid model for SN_A matching
# Based on SN_12C_CSM5 with varied H mass, explosion energy, Ni56 mass
# STELLA 50d, CMFGEN at 35d post-SBO, mdot=1e-10

model_name: SN_12C_GRID_H05_E50_N06
description: 'Grid model: H=0.05 Msun, EBurst=5.0 (~0.42 foe KE), Ni56=0.06 Msun. STELLA 50d, CMFGEN at 35d post-SBO.'
run_cmfgen: true
run_sirocco: false
run_sedona: false
run_superlite: false
reuse_stella: false
restart_stella: false
kepler_presn:
  presn_file: /viper/ptmp1/sbrennan/SN2024pba/SN_12C_CSM5/s12.0-presn-stripped
  mass_cut_msun: 1.4
  h_surface_fraction: 0.7
  h_surface_mass_msun: 0.05
  t_floor_K: 3000.0
  smooth_profile: true
  smooth_max_gradient: 5.0
  smooth_sigma: 3.0
  csm_wind:
    n_zones: 50
    mdot_msun_yr: 1.0e-10
    velocity_kms: 100
    duration_yr: 320
    T_K: 5000
    density_profile: sigmoid
ejecta:
  M_ejecta_A: 0.0
  R_star_cm: 0.0
  n_shell: 0.0
  V_ejecta_A_initial_kms: 0.0
hydro_backend: stella
stella:
  convection: false
  target_days: 50.0
  nzon: 500
  kappa: 0.34
  snapshot_interval: 1.0
  iout: 10
  r_min: 0.0
  rho_min: 0.0
  stella_root: /ptmp/sbrennan/stella/OpenStella
  partition: general
  memory: 16G
  time: '23:59:00'
  outer_fraction: 0.3
  transition_radius: 1e13
  explosion_energy: 5.0
  explosion_mass: 0.3
  explosion_time: 10.0
  explosion_delay: 0.0
  initial_kinetic_energy: 0.0
  nstmax: 2000000
  eps: 0.003
  hmax: 500000.0
  hmin: 1.0e-14
  meth: 2
  aq: 50.0
  bq: 1.0
  fit_tau: 5.0
  tau_tol: 1.3
  disable_scattering: false
  stella_tau_min: 1e-4
  wacc_r: 1.0
  wacc_v: 1.0
  wacc_t: 0.5
  wacc_rad: 0.5
  temp_floor: 0.03
  floor_rad: 0.01
  use_ronfict: true
  nickel56:
    enabled: true
    total_mass_msun: 0.06
    distribution_mass_msun: 0.3
    distribution_type: uniform
    inner_zone_fraction: 0.4
temperature:
  temp_profile_type: adiabatic
  N_T_ejecta: 0.6
  T_inner_max: 100000
  T_csm: 5000
cmfgen_conversion:
  heracles_dir: heracles
  snapshot_days:
  - 35
  epoch_tolerance: 2.0
  stella_extra_days: 0
  output_file: cmfgen/SN_HYDRO_DATA
  cmfgen_tau_max: 30
  cmfgen_tau_min: 0.0
  n_grid: 100
  adaptive_grid: true
  gradient_threshold: 0.5
  velocity_max_kms: 20000
  opacity_model: stella_nlte
  kappa_constant: 0.34
  enable_grid_thinning: true
  grid_thinning_threshold: 0.005
  enable_adaptive_grid: true
  base_grid_target: 80
  max_points: 400
  min_points: 50
  min_nd: 220
  max_radius_jump: 0.05
  max_temp_jump: 0.1
  max_density_jump: 0.15
  smooth_velocity: false
  no_velocity_smoothing: true
  smooth_wiggles: true
  wiggle_window: 5
  velocity_smooth_window_kms: 50.0
  enable_velocity_spacing_optimization: false
  include_ne_amr: false
  max_ne_jump: 0.1
  max_logtau_jump: 0.25
  max_velocity_jump: 0.3
  max_sigma_jump: 0.5
  max_cell_ratio: 1.5
  thin_grid_tau: 1.0
  thin_grid_priority: 4.0
  outer_boundary_extra_points: 5
  outer_boundary_ratio: 1.5
  min_dr_r: 1.0e-06
  max_dr_r: 0.15
  sigma_priority_threshold: 1.0
  sigma_priority: 10.0
  dsigma_priority_threshold: 0.3
  dsigma_priority: 10.0
  smooth_sigma: false
  max_dsigma: 1.0
  sigma_smooth_passes: 10
  sigma_smooth_window: 0.3
cmfgen:
  base_dir: ./cmfgen_base
  model_type: static_snapshot
  init_num_its: 25
  proxy_populations: false
  inc_rad_decays: true
  vturb: 20.0
  incl_rel: false
  vel_law: 12
  target_nd: 150
  depth_independent_solver: false
  remove_species:
  - FeIV_ISF
  - FeV_ISF
  vadat_overrides:
    OB_RAT: 1.0D0
    STOP_IF_BP: F
    STOP_IF_MW: F
    THK_CONT: F
    FIX_T: T
    FIX_T_AUTO: F
    DO_NG: F
    MAX_LAM: 1.0D5
    MAX_LIN: 3.0D0
    METHOD: ZERO
    LAM_SCALE_OPT: LIMIT
    BA_CHK_FAC: 5.0D-02
    REV_RGRID: F
  partition: general
  time: '23:59:00'
  mem: 16G
  init_mem: 16G
  init_partition: general
  init_time: '23:59:00'
  n_ob_ins: 30
  final_requeue_when: finish
  final_requeue_max: 500
  auto_set_rstar: false
  auto_set_lstar: false
  phot_tau: 0.6666667
  bb_teff_k: 9100
  lstar_radius_mode: RMAX
superlite:
  partition: general
  ntasks: 1
  cpus_per_task: 16
  memory: 16G
  time: '23:59:00'
  install_dir: /ptmp/sbrennan/superlite
  exe: /ptmp/sbrennan/superlite/superlite
output:
  model_dir: ./SN_12C_GRID_H05_E50_N06
  stella_output: stella
  cmfgen_output: cmfgen
  sedona_output: sedona
  superlite_output: superlite
  plots: plots
  outputs: output
